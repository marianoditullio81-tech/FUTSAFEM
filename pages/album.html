<!DOCTYPE html><html class="dark" lang="es"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport">
<title>FUTSAFEM - Álbum</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@400;600;700&amp;family=Hanken+Grotesk:wght@400;500;700&amp;family=JetBrains+Mono:wght@500&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "on-tertiary-fixed": "#002022", "on-primary-container": "#ffffff", "primary-fixed-dim": "#ecb2ff",
                    "primary-fixed": "#f8d8ff", "on-surface-variant": "#d4c0d7", "on-surface": "#e2e2e6",
                    "on-secondary": "#283500", "on-tertiary-fixed-variant": "#004f54", "surface-variant": "#333538",
                    "inverse-primary": "#9900cf", "surface-container": "#1e2023", "secondary": "#ffffff",
                    "on-tertiary-container": "#ffffff", "secondary-fixed": "#c3f400", "on-primary-fixed": "#320047",
                    "surface-bright": "#37393d", "surface-container-low": "#1a1c1f", "on-error-container": "#ffdad6",
                    "on-tertiary": "#00363a", "surface-container-highest": "#333538", "tertiary-fixed": "#7df4ff",
                    "surface-container-high": "#282a2d", "primary-container": "#bd00ff", "on-primary-fixed-variant": "#74009f",
                    "on-error": "#690005", "surface-tint": "#ecb2ff", "inverse-on-surface": "#2f3034",
                    "background": "#111316", "secondary-fixed-dim": "#abd600", "on-background": "#e2e2e6",
                    "on-secondary-container": "#556d00", "outline": "#9d8ba0", "surface-dim": "#111316",
                    "secondary-container": "#c3f400", "outline-variant": "#514255", "tertiary-container": "#00838b",
                    "inverse-surface": "#e2e2e6", "primary": "#ecb2ff", "on-primary": "#520071",
                    "surface-container-lowest": "#0c0e11", "error": "#ffb4ab", "surface": "#111316",
                    "on-secondary-fixed": "#161e00", "on-secondary-fixed-variant": "#3c4d00", "tertiary-fixed-dim": "#00dbe9",
                    "error-container": "#93000a", "tertiary": "#00dbe9"
            },
            "borderRadius": {"DEFAULT": "0.125rem", "lg": "0.25rem", "xl": "0.5rem", "full": "0.75rem"},
            "spacing": {"base": "8px", "margin-mobile": "20px", "stack-sm": "4px", "stack-md": "12px", "gutter": "16px", "margin-desktop": "40px", "stack-lg": "24px"},
            "fontFamily": {"display-lg": ["Archivo Narrow"], "body-sm": ["Hanken Grotesk"], "headline-md": ["Archivo Narrow"], "label-caps": ["JetBrains Mono"], "display-lg-mobile": ["Archivo Narrow"], "body-md": ["Hanken Grotesk"]},
            "fontSize": {
                    "display-lg": ["48px", {"lineHeight": "52px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                    "body-sm": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                    "headline-md": ["24px", {"lineHeight": "28px", "letterSpacing": "0.01em", "fontWeight": "600"}],
                    "label-caps": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "500"}],
                    "display-lg-mobile": ["36px", {"lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                    "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}]
            }
          },
        },
      }
    </script>
<style>
        body { background-color: #111316; color: #e2e2e6; -webkit-tap-highlight-color: transparent; }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        .sticker-glow-gold { box-shadow: 0 0 15px -2px rgba(255, 215, 0, 0.4); border: 2px solid #FFD700; }
        .sticker-glow-silver { box-shadow: 0 0 15px -2px rgba(192, 192, 192, 0.4); border: 2px solid #C0C0C0; }
        .sticker-glow-comun { border: 2px solid #514255; }
        .sticker-glow-epica { box-shadow: 0 0 15px -2px rgba(189, 0, 255, 0.5); border: 2px solid #bd00ff; }
        .perspective-card { transition: transform 0.3s ease, box-shadow 0.3s ease; }
        .perspective-card:active { transform: scale(0.96); }
        .pitch-texture { background-image: radial-gradient(#333538 0.5px, transparent 0.5px); background-size: 16px 16px; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="font-body-md selection:bg-primary selection:text-on-primary">
<header class="bg-surface text-primary top-0 flex justify-between items-center w-full px-margin-mobile h-16 z-50 fixed">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-2xl">sports_soccer</span>
<h1 class="font-display-lg-mobile text-display-lg-mobile text-primary tracking-tight">FUTSAFEM</h1>
</div>
<div class="flex items-center gap-2 bg-surface-container-highest px-3 py-1.5 rounded-full">
<span class="font-label-caps text-label-caps text-secondary-fixed" id="futsacoins-badge">0 🪙</span>
</div>
</header>
<main class="pt-20 pb-32 px-margin-mobile max-w-7xl mx-auto pitch-texture min-h-screen">
<section class="mb-stack-lg sticky top-16 z-40 bg-background/95 backdrop-blur-md pt-4 pb-2">
<div class="relative mb-4">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant">search</span>
<input class="w-full bg-surface-container border-none rounded-xl pl-11 pr-4 py-3 text-body-md focus:ring-2 focus:ring-primary placeholder:text-on-surface-variant transition-all" id="buscador" placeholder="Buscar jugadora o club..." type="text">
</div>
<a class="flex items-center gap-1 font-label-caps text-label-caps text-on-surface-variant hover:text-primary mb-2" href="./clubes.html">
<span class="material-symbols-outlined text-base">shield</span>
<span>Ver clubes</span>
</a>
<div class="flex gap-2 overflow-x-auto hide-scrollbar pb-1" id="filtros">
<button class="filtro-btn bg-primary text-on-primary px-6 py-2 rounded-full font-label-caps text-label-caps transition-all duration-200 active:scale-95" data-filtro="todas">Todas</button>
<button class="filtro-btn bg-surface-container text-on-surface-variant hover:bg-surface-variant px-6 py-2 rounded-full font-label-caps text-label-caps transition-all duration-200 active:scale-95" data-filtro="faltantes">Faltantes</button>
<button class="filtro-btn bg-surface-container text-on-surface-variant hover:bg-surface-variant px-6 py-2 rounded-full font-label-caps text-label-caps transition-all duration-200 active:scale-95" data-filtro="repetidas">Repetidas</button>
</div>
</section>
<div class="mb-stack-lg bg-surface-container rounded-xl p-4 border border-outline-variant/30">
<div class="flex justify-between items-center mb-2">
<span class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-wider">Progreso del Álbum</span>
<span class="font-label-caps text-label-caps text-secondary" id="progreso-texto">0 / 0</span>
</div>
<div class="h-2 w-full bg-surface-container-highest rounded-full overflow-hidden">
<div class="h-full bg-secondary rounded-full" id="progreso-barra" style="width: 0%"></div>
</div>
</div>
<p class="text-on-surface-variant font-body-sm text-center py-stack-lg hidden" id="album-vacio">
            Todavía no hay figuritas cargadas en el sistema. ¡Volvé pronto!
        </p>
<div class="space-y-10" id="album-contenido"></div>
<section class="hidden mt-stack-lg flex flex-col items-center gap-2" id="sponsors-strip">
<span class="font-label-caps text-label-caps text-on-surface-variant text-[10px] tracking-widest">CON EL APOYO DE</span>
<div class="flex items-center gap-4 flex-wrap justify-center" id="sponsors-logos"></div>
</section>
</main>
<nav class="bg-surface-container fixed bottom-0 w-full z-50 flex justify-around items-center px-4 py-2 pb-safe rounded-t-xl shadow-lg border-t border-outline-variant">
<a class="flex flex-col items-center justify-center text-on-surface-variant p-2 transition-transform duration-300 active:scale-90 hover:text-primary" href="./home.html">
<span class="material-symbols-outlined">home</span>
<span class="font-label-caps text-label-caps">Home</span>
</a>
<a class="flex flex-col items-center justify-center bg-secondary-container text-on-secondary-container rounded-full px-4 py-1 transition-transform duration-300 active:scale-90" href="./album.html">
<span class="material-symbols-outlined">style</span>
<span class="font-label-caps text-label-caps">Album</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant p-2 transition-transform duration-300 active:scale-90 hover:text-primary" href="./mercado-pases.html">
<span class="material-symbols-outlined">swap_calls</span>
<span class="font-label-caps text-label-caps">Market</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant p-2 transition-transform duration-300 active:scale-90 hover:text-primary" href="./tribuna.html">
<span class="material-symbols-outlined">forum</span>
<span class="font-label-caps text-label-caps">Tribuna</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant p-2 transition-transform duration-300 active:scale-90 hover:text-primary" href="./perfil.html">
<span class="material-symbols-outlined">person</span>
<span class="font-label-caps text-label-caps">Profile</span>
</a>
</nav>
<script type="module">
  import { exigirSesion, obtenerPerfil } from "../js/auth-helpers.js";
  import { obtenerAlbumDeUsuaria } from "../js/album-helpers.js";
  import { PLACEHOLDER_STICKER_URL } from "../js/home-helpers.js";
  import { obtenerSponsorsPorPantalla } from "../js/sponsor-helpers.js";

  let clubes = [];
  let filtroActual = 'todas';
  let busquedaActual = '';

  function renderAlbum() {
    const contenedor = document.getElementById('album-contenido');
    contenedor.innerHTML = '';

    let totalFiguritas = 0;
    let totalConseguidas = 0;

    const texto = busquedaActual.trim().toLowerCase();

    clubes.forEach((club) => {
      const stickersClub = club.stickers.filter((item) => {
        if (filtroActual === 'faltantes' && item.cantidad > 0) return false;
        if (filtroActual === 'repetidas' && item.cantidad <= 1) return false;
        if (texto) {
          const nombreJugadora = (item.jugadora && item.jugadora.nombre || '').toLowerCase();
          const nombreClub = club.nombre.toLowerCase();
          if (!nombreJugadora.includes(texto) && !nombreClub.includes(texto)) return false;
        }
        return true;
      });

      totalFiguritas += club.stickers.length;
      totalConseguidas += club.stickers.filter((item) => item.cantidad > 0).length;

      if (stickersClub.length === 0) return;

      const conseguidasClub = club.stickers.filter((item) => item.cantidad > 0).length;

      const section = document.createElement('section');
      section.innerHTML = `
        <a class="flex items-center gap-4 mb-stack-md" href="./club.html?id=${encodeURIComponent(club.clubId)}">
          <div class="w-10 h-10 rounded-lg bg-surface-container-high flex items-center justify-center border border-outline-variant">
            <span class="material-symbols-outlined text-primary">shield</span>
          </div>
          <h2 class="font-headline-md text-headline-md text-on-surface">${club.nombre}</h2>
          <span class="ml-auto font-label-caps text-label-caps text-on-surface-variant">${conseguidasClub}/${club.stickers.length}</span>
        </a>
        <div class="grid grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-3"></div>
      `;
      const grid = section.querySelector('div.grid');

      stickersClub.forEach((item) => {
        const card = document.createElement('div');
        if (item.cantidad > 0) {
          const rareza = item.sticker.rareza || 'comun';
          card.className = `aspect-[2/3] rounded-lg overflow-hidden relative sticker-glow-${rareza} perspective-card`;
          const nombreJugadora = item.jugadora ? item.jugadora.nombre : 'Desconocida';
          const puesto = item.jugadora ? (item.jugadora.puesto || '').toUpperCase() : '';
          const repetidaBadge = item.cantidad > 1 ? `<span class="absolute top-2 right-2 z-20 bg-secondary-container text-on-secondary-container text-[10px] font-label-caps px-1.5 py-0.5 rounded">x${item.cantidad}</span>` : '';
          card.innerHTML = `
            <img class="w-full h-full object-cover" src="${item.sticker.imagenUrl || PLACEHOLDER_STICKER_URL}" alt="${nombreJugadora}">
            ${repetidaBadge}
            <div class="absolute top-2 left-2 z-20">
              <span class="bg-black/60 backdrop-blur-md text-[10px] font-label-caps px-1.5 py-0.5 rounded border border-white/20 text-white">${puesto}</span>
            </div>
            <div class="absolute bottom-0 w-full p-1.5 bg-gradient-to-t from-black/80 to-transparent z-20">
              <p class="text-[11px] font-bold text-white truncate">${nombreJugadora}</p>
            </div>
          `;
        } else {
          card.className = 'aspect-[2/3] rounded-lg bg-surface-container-high border-2 border-dashed border-outline-variant flex flex-col items-center justify-center opacity-50 relative';
          card.innerHTML = `
            <span class="material-symbols-outlined text-4xl text-on-surface-variant mb-2">person</span>
            <span class="font-label-caps text-[10px] text-on-surface-variant">#${item.sticker.id.slice(0, 4)}</span>
          `;
        }
        grid.appendChild(card);
      });

      contenedor.appendChild(section);
    });

    document.getElementById('progreso-texto').textContent = `${totalConseguidas} / ${totalFiguritas}`;
    const porcentaje = totalFiguritas > 0 ? Math.round((totalConseguidas / totalFiguritas) * 100) : 0;
    document.getElementById('progreso-barra').style.width = `${porcentaje}%`;
    document.getElementById('album-vacio').classList.toggle('hidden', totalFiguritas > 0);
  }

  document.querySelectorAll('.filtro-btn').forEach((btn) => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.filtro-btn').forEach((b) => {
        b.classList.remove('bg-primary', 'text-on-primary');
        b.classList.add('bg-surface-container', 'text-on-surface-variant');
      });
      btn.classList.remove('bg-surface-container', 'text-on-surface-variant');
      btn.classList.add('bg-primary', 'text-on-primary');
      filtroActual = btn.dataset.filtro;
      renderAlbum();
    });
  });

  document.getElementById('buscador').addEventListener('input', (e) => {
    busquedaActual = e.target.value;
    renderAlbum();
  });

  exigirSesion(async (user) => {
    const perfil = await obtenerPerfil(user.uid);
    if (!perfil) return;
    if (perfil.estadoConsentimiento === 'pendiente') {
      window.location.replace('./esperando-consentimiento.html');
      return;
    }
    document.getElementById('futsacoins-badge').textContent = `${perfil.futsacoins || 0} 🪙`;
    clubes = await obtenerAlbumDeUsuaria(user.uid);
    renderAlbum();

    const sponsors = await obtenerSponsorsPorPantalla('album');
    if (sponsors.length > 0) {
      const logosEl = document.getElementById('sponsors-logos');
      sponsors.forEach((sponsor) => {
        const item = sponsor.link ? document.createElement('a') : document.createElement('div');
        if (sponsor.link) {
          item.href = sponsor.link;
          item.target = '_blank';
        }
        item.className = 'flex items-center justify-center opacity-80 hover:opacity-100 transition-opacity';
        const img = document.createElement('img');
        img.src = sponsor.logoUrl || '';
        img.alt = sponsor.nombre || '';
        img.className = 'h-8 max-w-[100px] object-contain';
        item.appendChild(img);
        logosEl.appendChild(item);
      });
      document.getElementById('sponsors-strip').classList.remove('hidden');
    }
  });
</script>
</body></html>
