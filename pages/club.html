<!DOCTYPE html><html class="dark" lang="es"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport">
<title>FUTSAFEM - Club</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@400;600;700&amp;family=Hanken+Grotesk:wght@400;600&amp;family=JetBrains+Mono:wght@500&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "primary": "#ecb2ff", "on-primary-container": "#ffffff", "on-primary": "#520071",
                    "primary-container": "#bd00ff", "secondary": "#ffffff", "secondary-container": "#c3f400",
                    "on-secondary-container": "#556d00", "error": "#ffb4ab", "error-container": "#93000a",
                    "on-error-container": "#ffdad6", "surface": "#111316", "surface-container": "#1e2023",
                    "surface-container-high": "#282a2d", "surface-container-highest": "#333538",
                    "on-surface": "#e2e2e6", "on-surface-variant": "#d4c0d7", "outline": "#9d8ba0",
                    "outline-variant": "#514255", "background": "#111316"
            },
            "borderRadius": {"DEFAULT": "0.125rem", "lg": "0.25rem", "xl": "0.5rem", "full": "0.75rem"},
            "spacing": {"base": "8px", "margin-mobile": "20px", "stack-sm": "4px", "stack-md": "12px", "gutter": "16px", "stack-lg": "24px"},
            "fontFamily": {"display-lg-mobile": ["Archivo Narrow"], "headline-md": ["Archivo Narrow"], "label-caps": ["JetBrains Mono"], "body-sm": ["Hanken Grotesk"], "body-md": ["Hanken Grotesk"]},
            "fontSize": {
                    "display-lg-mobile": ["36px", {"lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                    "headline-md": ["24px", {"lineHeight": "28px", "letterSpacing": "0.01em", "fontWeight": "600"}],
                    "label-caps": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "500"}],
                    "body-sm": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                    "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}]
            }
          },
        },
      }
    </script>
<style>
        body { background-color: #111316; color: #e2e2e6; -webkit-font-smoothing: antialiased; }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
</style>
</head>
<body class="font-body-md min-h-screen pb-16">
<header class="bg-surface sticky top-0 z-50 flex items-center gap-4 px-margin-mobile h-16 border-b border-outline-variant">
<a href="./album.html"><span class="material-symbols-outlined text-primary text-2xl">arrow_back</span></a>
<h1 class="font-display-lg-mobile text-display-lg-mobile text-primary tracking-tight italic uppercase truncate" id="titulo-club">Club</h1>
</header>
<main class="px-margin-mobile pt-stack-lg max-w-md mx-auto flex flex-col gap-stack-lg">
<section class="flex flex-col items-center text-center gap-3">
<div class="w-24 h-24 rounded-full border-4 border-primary p-1 bg-surface-container overflow-hidden flex items-center justify-center">
<img class="w-full h-full object-cover rounded-full hidden" id="escudo-club">
<span class="material-symbols-outlined text-5xl text-on-surface-variant" id="escudo-placeholder">shield</span>
</div>
<div>
<h2 class="font-headline-md text-headline-md text-white" id="nombre-club">—</h2>
<p class="font-label-caps text-label-caps text-on-surface-variant uppercase" id="categoria-club"></p>
</div>
</section>
<section>
<p class="font-label-caps text-label-caps text-on-surface-variant uppercase mb-2">Plantel</p>
<div class="flex flex-col gap-stack-sm" id="lista-plantel"></div>
<p class="hidden text-center py-stack-lg text-on-surface-variant font-body-sm" id="plantel-vacio">Todavía no hay jugadoras ni cuerpo técnico con foto aprobada en este club.</p>
</section>
</main>
<script type="module">
  import { exigirSesion } from "../js/auth-helpers.js";
  import { obtenerClub, obtenerPlantelClub } from "../js/home-helpers.js";

  const NOMBRES_ROL = { jugadora: 'Jugadora', ct: 'Cuerpo Técnico' };

  exigirSesion(async () => {
    const params = new URLSearchParams(window.location.search);
    const clubId = params.get('id');
    if (!clubId) {
      window.location.replace('./album.html');
      return;
    }

    const club = await obtenerClub(clubId);
    if (!club) {
      window.location.replace('./album.html');
      return;
    }

    document.title = `FUTSAFEM - ${club.nombre}`;
    document.getElementById('titulo-club').textContent = club.nombre;
    document.getElementById('nombre-club').textContent = club.nombre;
    document.getElementById('categoria-club').textContent = club.categoria || '';

    if (club.escudoUrl) {
      const escudo = document.getElementById('escudo-club');
      escudo.src = club.escudoUrl;
      escudo.classList.remove('hidden');
      document.getElementById('escudo-placeholder').classList.add('hidden');
    }

    const plantel = await obtenerPlantelClub(clubId);
    plantel.sort((a, b) => (a.nombre || '').localeCompare(b.nombre || ''));

    const lista = document.getElementById('lista-plantel');
    if (plantel.length === 0) {
      document.getElementById('plantel-vacio').classList.remove('hidden');
    }

    for (const persona of plantel) {
      const card = document.createElement('a');
      card.href = `./perfil-publico.html?uid=${encodeURIComponent(persona.uid)}`;
      card.className = 'bg-surface-container border border-outline-variant rounded-lg p-3 flex items-center gap-3 active:scale-[0.98] transition-all';
      card.innerHTML = `
        <img class="w-12 h-12 rounded-full object-cover bg-surface-container-highest" src="${persona.fotoUrl}">
        <div class="flex-grow">
          <p class="font-body-md text-white">${persona.nombre || persona.apodo || 'Sin nombre'}</p>
          <p class="font-body-sm text-on-surface-variant">${NOMBRES_ROL[persona.rol] || persona.rol}${persona.puesto ? ' · ' + persona.puesto : ''}</p>
        </div>
      `;
      lista.appendChild(card);
    }
  });
</script>
</body></html>
