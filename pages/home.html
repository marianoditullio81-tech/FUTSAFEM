<style>

            mask-image: radial-gradient(circle at center, black, transparent 80%);

        }
        .pack-glow { animation: pulse-glow 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        .pack-glow.disponible-no { animation: none; opacity: 0.5; }
        @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 0 20px 0px rgba(189, 0, 255, 0.4); transform: scale(1); }
            50% { box-shadow: 0 0 40px 10px rgba(189, 0, 255, 0.7); transform: scale(1.02); }

<body class="font-body-md selection:bg-primary selection:text-on-primary overflow-x-hidden">
<div class="stadium-glow"></div>
<div class="court-lines"></div>
<header class="bg-surface text-primary z-50 fixed top-0 flex justify-between items-center w-full px-margin-mobile h-16 transition-all duration-200">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-3xl" style="font-variation-settings: 'FILL' 1;">sports_soccer</span>

</div>
<div class="flex items-center bg-surface-container-high px-3 py-1 rounded-full border border-outline-variant">
<span class="font-label-caps text-label-caps text-on-surface" id="futsacoins-badge">0 🪙</span>
</div>
</header>
<main class="relative z-10 pt-20 pb-32 px-margin-mobile max-w-md mx-auto flex flex-col gap-stack-lg">
<section class="flex flex-col items-center text-center py-stack-md">
<div class="relative group">
<div class="absolute inset-0 bg-primary opacity-20 blur-xl rounded-full group-hover:opacity-40 transition-opacity"></div>
<div class="w-32 h-32 rounded-full border-4 border-primary p-1 bg-surface-container overflow-hidden relative z-10 flex items-center justify-center">

<span class="material-symbols-outlined text-6xl text-on-surface-variant" id="foto-placeholder">person</span>
</div>
</div>
<div class="mt-4">
<h2 class="font-display-lg-mobile text-display-lg-mobile text-on-surface" id="nombre-usuaria">—</h2>
<div class="flex items-center justify-center gap-2 text-on-surface-variant font-label-caps mt-1">
<span class="uppercase tracking-widest" id="club-usuaria">—</span>
<span class="w-1 h-1 bg-outline rounded-full" id="separador-puesto"></span>
<span class="uppercase tracking-widest" id="puesto-usuaria"></span>
</div>
</div>
</section>
<section class="grid grid-cols-2 gap-4">
<div class="bg-surface-container border border-outline-variant p-4 rounded-xl flex flex-col justify-between aspect-square transition-transform active:scale-95">
<div class="flex justify-between items-start">
<span class="material-symbols-outlined text-secondary-fixed text-3xl" style="font-variation-settings: 'FILL' 1;">local_fire_department</span>
<span class="font-label-caps text-on-surface-variant text-[10px]">STREAK</span>
</div>
<div>
<p class="font-headline-md text-headline-md text-on-surface" id="racha-dias">0 días</p>
<p class="font-body-sm text-body-sm text-on-surface-variant">¡Seguí tu racha!</p>
</div>
</div>
<div class="bg-surface-container border border-outline-variant p-4 rounded-xl flex flex-col justify-between aspect-square transition-transform active:scale-95">
<span class="material-symbols-outlined text-primary text-3xl">style</span>
<div>
<p class="font-headline-md text-headline-md text-on-surface">Colección</p>
<p class="font-body-sm text-body-sm text-on-surface-variant" id="coleccion-progreso">0/0 figuritas</p>
</div>
</div>
</section>
<section class="hidden" id="banner-validacion">
<a class="flex items-center gap-3 bg-surface-container border border-outline-variant rounded-xl p-4 active:scale-[0.98] transition-all" href="./validacion-fotos.html">
<span class="material-symbols-outlined text-primary text-3xl">how_to_vote</span>
<div class="flex-grow">
<p class="font-headline-md text-headline-md text-on-surface">Validar fotos</p>
<p class="font-body-sm text-on-surface-variant" id="texto-banner-validacion"></p>
</div>
<span class="material-symbols-outlined text-on-surface-variant">chevron_right</span>
</a>
</section>
<section class="hidden" id="banner-admin">
<a class="flex items-center gap-3 bg-error-container border border-outline-variant rounded-xl p-4 active:scale-[0.98] transition-all" href="./admin-fotos-rechazadas.html">
<span class="material-symbols-outlined text-on-error-container text-3xl">shield_person</span>
<div class="flex-grow">
<p class="font-headline-md text-headline-md text-on-error-container">Panel admin</p>
<p class="font-body-sm text-on-error-container/80">Confirmar fotos rechazadas</p>
</div>
<span class="material-symbols-outlined text-on-error-container">chevron_right</span>
</a>
</section>
<section class="mt-4">
<button class="pack-glow relative w-full h-48 bg-primary-container rounded-2xl border-2 border-primary overflow-hidden flex flex-col items-center justify-center transition-all active:scale-95" id="btn-abrir-sobre">
<div class="relative z-10 flex flex-col items-center">
<div class="bg-surface-container-lowest px-4 py-1 rounded-full mb-4 border border-primary/30">
<span class="font-label-caps text-label-caps text-primary" id="sobre-estado">REVISANDO...</span>
</div>
<span class="material-symbols-outlined text-6xl text-on-primary-container mb-2" style="font-variation-settings: 'FILL' 1;">package_2</span>

</div>

</main>
<nav class="bg-surface-container fixed bottom-0 w-full z-50 flex justify-around items-center px-4 py-2 pb-safe shadow-lg rounded-t-xl border-t border-outline-variant">
<a class="flex flex-col items-center justify-center bg-secondary-container text-on-secondary-container rounded-full px-4 py-1 transition-transform duration-300 active:scale-90 active-nav-glow" href="./home.html">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">home</span>
<span class="font-label-caps text-label-caps">Home</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant p-2 transition-transform duration-300 active:scale-90 hover:text-primary" href="./album.html">
<span class="material-symbols-outlined">style</span>
<span class="font-label-caps text-label-caps">Album</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant p-2 transition-transform duration-300 active:scale-90 hover:text-primary" href="./mercado-pases.html">
<span class="material-symbols-outlined">swap_calls</span>
<span class="font-label-caps text-label-caps">Market</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant p-2 transition-transform duration-300 active:scale-90 hover:text-primary" href="./perfil.html">
<span class="material-symbols-outlined">person</span>
<span class="font-label-caps text-label-caps">Profile</span>
</a>
</nav>
<script type="module">
  import { exigirSesion, obtenerPerfil } from "../js/auth-helpers.js";
  import { obtenerClub, contarStickersTotales, contarColeccionUnica, esSobreDisponibleHoy } from "../js/home-helpers.js";
  import { contarFotosPendientes } from "../js/validacion-helpers.js";

  const NOMBRES_PUESTO = { arquera: 'Arquera', cierre: 'Cierre', ala: 'Ala', pivot: 'Pivot' };
  const NOMBRES_CARGO = { dt: 'Directora Técnica', at: 'Asistente Técnica', pf: 'Preparadora Física', ea: 'Entrenadora de Arqueras', analista: 'Analista de Video', medico: 'Cuerpo Médico' };

  exigirSesion(async (user) => {
    const perfil = await obtenerPerfil(user.uid);
    if (!perfil) return;

    if (perfil.estadoConsentimiento === 'pendiente') {
      window.location.replace('./esperando-consentimiento.html');
      return;
    }

    document.getElementById('nombre-usuaria').textContent = perfil.nombre || '—';
    document.getElementById('futsacoins-badge').textContent = `${perfil.futsacoins || 0} 🪙`;
    document.getElementById('racha-dias').textContent = `${perfil.rachaActual || 0} días`;

    if (perfil.fotoUrl) {
      const img = document.getElementById('foto-perfil');
      img.src = perfil.fotoUrl;
      img.classList.remove('hidden');
      document.getElementById('foto-placeholder').classList.add('hidden');
    }

    const club = await obtenerClub(perfil.clubId);
    document.getElementById('club-usuaria').textContent = club ? club.nombre : (perfil.clubId || '—');

    const puestoEl = document.getElementById('puesto-usuaria');
    const separadorEl = document.getElementById('separador-puesto');
    let etiquetaPuesto = '';
    if (perfil.rol === 'jugadora') etiquetaPuesto = NOMBRES_PUESTO[perfil.puesto] || '';
    else if (perfil.rol === 'ct') etiquetaPuesto = NOMBRES_CARGO[perfil.puesto] || '';
    else if (perfil.rol === 'hincha') etiquetaPuesto = 'Hincha';
    puestoEl.textContent = etiquetaPuesto;
    if (!etiquetaPuesto) separadorEl.classList.add('hidden');

    const [totalStickers, coleccion] = await Promise.all([
      contarStickersTotales(),
      contarColeccionUnica(user.uid),
    ]);
    document.getElementById('coleccion-progreso').textContent = `${coleccion}/${totalStickers} figuritas`;

    if (perfil.rol === 'admin') {
      document.getElementById('banner-admin').classList.remove('hidden');
    }

    const pendientes = await contarFotosPendientes(user.uid);
    if (pendientes > 0) {
      document.getElementById('texto-banner-validacion').textContent = `${pendientes} foto${pendientes === 1 ? '' : 's'} esperando tu voto`;
      document.getElementById('banner-validacion').classList.remove('hidden');
    }

    const disponible = esSobreDisponibleHoy(perfil);
    const btn = document.getElementById('btn-abrir-sobre');
    const estadoEl = document.getElementById('sobre-estado');
    if (disponible) {
      estadoEl.textContent = '1 DISPONIBLE';
      btn.addEventListener('click', () => { window.location.href = './apertura-sobre.html'; });
    } else {
      estadoEl.textContent = 'VOLVÉ MAÑANA';
      btn.classList.add('disponible-no');
      btn.disabled = true;
    }
  });
</script>
</body></html>
