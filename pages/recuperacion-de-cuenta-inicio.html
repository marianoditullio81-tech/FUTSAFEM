<!DOCTYPE html>
<html class="dark" lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>FUTSAFEM - Recuperar cuenta</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:ital,wght@0,400..700;1,400..700&amp;family=JetBrains+Mono:wght@100..800&amp;family=Hanken+Grotesk:wght@100..900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "tertiary-fixed": "#7df4ff", "primary": "#ecb2ff", "inverse-on-surface": "#2f3034",
                    "on-error-container": "#ffdad6", "surface": "#111316", "tertiary": "#00dbe9",
                    "surface-container-lowest": "#0c0e11", "on-tertiary-fixed-variant": "#004f54",
                    "error-container": "#93000a", "on-tertiary": "#00363a", "on-secondary-container": "#556d00",
                    "tertiary-fixed-dim": "#00dbe9", "on-primary-fixed-variant": "#74009f",
                    "on-primary-container": "#ffffff", "on-surface": "#e2e2e6", "on-primary": "#520071",
                    "secondary-fixed": "#c3f400", "tertiary-container": "#00838b", "surface-variant": "#333538",
                    "surface-dim": "#111316", "surface-container-low": "#1a1c1f",
                    "surface-container-highest": "#333538", "on-surface-variant": "#d4c0d7",
                    "background": "#111316", "surface-bright": "#37393d", "on-primary-fixed": "#320047",
                    "on-secondary": "#283500", "secondary-container": "#c3f400", "on-error": "#690005",
                    "inverse-primary": "#9900cf", "secondary-fixed-dim": "#abd600", "surface-tint": "#ecb2ff",
                    "error": "#ffb4ab", "on-tertiary-container": "#ffffff", "surface-container-high": "#282a2d",
                    "primary-fixed": "#f8d8ff", "outline": "#9d8ba0", "on-tertiary-fixed": "#002022",
                    "outline-variant": "#514255", "inverse-surface": "#e2e2e6", "secondary": "#ffffff",
                    "primary-fixed-dim": "#ecb2ff", "on-secondary-fixed": "#161e00", "surface-container": "#1e2023",
                    "primary-container": "#bd00ff", "on-background": "#e2e2e6", "on-secondary-fixed-variant": "#3c4d00"
            },
            "borderRadius": {"DEFAULT": "0.125rem", "lg": "0.25rem", "xl": "0.5rem", "full": "0.75rem"},
            "spacing": {"margin-desktop": "40px", "gutter": "16px", "base": "8px", "stack-sm": "4px", "margin-mobile": "20px", "stack-lg": "24px", "stack-md": "12px"},
            "fontFamily": {"headline-md": ["Archivo Narrow"], "display-lg-mobile": ["Archivo Narrow"], "label-caps": ["JetBrains Mono"], "display-lg": ["Archivo Narrow"], "body-sm": ["Hanken Grotesk"], "body-md": ["Hanken Grotesk"]},
            "fontSize": {
                    "headline-md": ["24px", {"lineHeight": "28px", "letterSpacing": "0.01em", "fontWeight": "600"}],
                    "display-lg-mobile": ["36px", {"lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                    "label-caps": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "500"}],
                    "display-lg": ["48px", {"lineHeight": "52px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                    "body-sm": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                    "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}]
            }
          },
        },
      }
    </script>
<style>
        body { background-color: #111316; color: #e2e2e6; overflow-x: hidden; }
        .glow-button { box-shadow: 0 0 20px rgba(189, 0, 255, 0.4); transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .glow-button:hover { box-shadow: 0 0 35px rgba(189, 0, 255, 0.6); transform: scale(1.02); }
        .glow-button:active { transform: scale(0.98); }
        .input-focus-effect:focus-within { border-color: #ecb2ff; box-shadow: 0 0 0 1px #ecb2ff; }
    </style>
</head>
<body class="font-body-md text-body-md flex min-h-screen items-center justify-center p-margin-mobile">
<main class="relative z-10 w-full max-w-[420px] bg-surface-container-low p-stack-lg rounded-xl border border-outline-variant shadow-2xl">
<header class="flex flex-col items-center mb-stack-lg">
<div class="w-20 h-20 mb-stack-md relative">
<div class="relative flex items-center justify-center w-full h-full bg-surface-container-highest rounded-xl border-2 border-primary">
<span class="material-symbols-outlined text-primary text-[48px]">lock_reset</span>
</div>
</div>
<h1 class="font-display-lg-mobile text-display-lg-mobile italic font-black text-primary tracking-tighter uppercase">RECUPERAR CUENTA</h1>
<p class="font-body-sm text-on-surface-variant text-center mt-2">Ingresá el correo con el que te registraste y te enviamos un link para crear una nueva contraseña.</p>
</header>
<form class="space-y-stack-md" id="recuperar-form">
<div class="space-y-2">
<label class="font-label-caps text-label-caps text-on-surface ml-1" for="email">CORREO ELECTRÓNICO</label>
<div class="relative input-focus-effect bg-surface-container-highest rounded-lg border border-outline-variant transition-all duration-200">
<input class="block w-full px-3 py-3 bg-transparent border-none text-on-surface placeholder:text-outline focus:ring-0 font-body-md" id="email" name="email" placeholder="usuario@ejemplo.com" required type="email"/>
</div>
</div>
<p class="font-body-sm text-error hidden" id="form-error"></p>
<button class="glow-button w-full py-4 px-6 bg-primary-container text-on-primary-container font-headline-md text-headline-md font-bold rounded-lg uppercase tracking-wide mt-stack-md" id="btn-submit" type="submit">ENVIAR LINK</button>
</form>
<footer class="mt-stack-lg pt-stack-md border-t border-outline-variant/30 text-center">
<a class="inline-flex items-center gap-2 font-headline-md text-headline-md text-secondary hover:text-primary transition-colors font-bold uppercase italic" href="./login.html">
<span class="material-symbols-outlined text-[18px]">arrow_back</span>
<span>Volver a Ingresar</span>
</a>
</footer>
</main>
<script type="module">
  import { enviarRecuperacionContrasena } from "../js/auth-helpers.js";

  document.getElementById('recuperar-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = document.getElementById('email').value;
    const errorEl = document.getElementById('form-error');
    errorEl.classList.add('hidden');
    const btn = document.getElementById('btn-submit');
    btn.disabled = true;
    btn.textContent = 'ENVIANDO...';
    try {
      await enviarRecuperacionContrasena(email);
      window.location.href = './recuperacion-exitosa.html';
    } catch (err) {
      errorEl.textContent = 'No pudimos enviar el correo. Revisá que el email sea correcto.';
      errorEl.classList.remove('hidden');
      btn.disabled = false;
      btn.textContent = 'ENVIAR LINK';
    }
  });
</script>
</body></html>
