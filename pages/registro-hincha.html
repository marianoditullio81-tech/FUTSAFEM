<!DOCTYPE html><html class="dark" lang="es"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>FUTSAFEM - Registro de Hinchada</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:ital,wght@0,400..700;1,400..700&amp;family=Hanken+Grotesk:wght@300;400;600;800&amp;family=JetBrains+Mono:wght@500&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "primary": "#ecb2ff", "on-primary-fixed": "#320047", "tertiary": "#00dbe9", "on-error": "#690005",
                    "on-tertiary-fixed": "#002022", "on-tertiary": "#00363a", "on-secondary": "#283500",
                    "error-container": "#93000a", "on-error-container": "#ffdad6", "error": "#ffb4ab",
                    "surface-dim": "#111316", "on-background": "#e2e2e6", "on-secondary-fixed": "#161e00",
                    "primary-fixed": "#f8d8ff", "surface-container-high": "#282a2d", "surface-container-highest": "#333538",
                    "primary-fixed-dim": "#ecb2ff", "surface-container-lowest": "#0c0e11", "secondary-container": "#c3f400",
                    "surface-container-low": "#1a1c1f", "outline-variant": "#514255", "on-primary-container": "#ffffff",
                    "on-tertiary-fixed-variant": "#004f54", "tertiary-container": "#00838b", "on-secondary-fixed-variant": "#3c4d00",
                    "outline": "#9d8ba0", "primary-container": "#bd00ff", "on-surface": "#e2e2e6", "surface-variant": "#333538",
                    "surface": "#111316", "secondary": "#ffffff", "background": "#111316", "secondary-fixed-dim": "#abd600",
                    "surface-bright": "#37393d", "on-primary": "#520071", "tertiary-fixed-dim": "#00dbe9",
                    "inverse-on-surface": "#2f3034", "surface-container": "#1e2023", "on-primary-fixed-variant": "#74009f",
                    "tertiary-fixed": "#7df4ff", "on-secondary-container": "#556d00", "secondary-fixed": "#c3f400",
                    "inverse-surface": "#e2e2e6", "on-surface-variant": "#d4c0d7", "surface-tint": "#ecb2ff"
            },
            "borderRadius": {"DEFAULT": "0.125rem", "lg": "0.25rem", "xl": "0.5rem", "full": "0.75rem"},
            "spacing": {"stack-sm": "4px", "stack-md": "12px", "stack-lg": "24px", "margin-desktop": "40px", "margin-mobile": "20px", "gutter": "16px", "base": "8px"},
            "fontFamily": {"display-lg": ["Archivo Narrow"], "body-md": ["Hanken Grotesk"], "label-caps": ["JetBrains Mono"], "headline-md": ["Archivo Narrow"], "body-sm": ["Hanken Grotesk"], "display-lg-mobile": ["Archivo Narrow"]},
            "fontSize": {
                    "display-lg": ["48px", {"lineHeight": "52px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                    "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                    "label-caps": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "500"}],
                    "headline-md": ["24px", {"lineHeight": "28px", "letterSpacing": "0.01em", "fontWeight": "600"}],
                    "body-sm": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                    "display-lg-mobile": ["36px", {"lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700"}]
            }
          },
        },
      }
    </script>
<style>
        body { background-color: #111316; color: #e2e2e6; -webkit-font-smoothing: antialiased; }
        .rare-glow { box-shadow: 0 0 30px rgba(189, 0, 255, 0.2); }
        .club-card-selected { border-color: #ecb2ff; background: rgba(189, 0, 255, 0.1); }
        input:focus, select:focus { outline: none; border-color: #ecb2ff !important; box-shadow: 0 0 0 2px rgba(236, 178, 255, 0.2); }
    </style>
</head>
<body class="min-h-screen flex flex-col font-body-md overflow-x-hidden">
<header class="w-full top-0 sticky z-50 bg-surface">
<div class="flex justify-between items-center px-margin-mobile py-stack-md w-full">
<div class="flex items-center gap-4">
<a href="./bienvenida.html"><span class="material-symbols-outlined text-primary text-2xl">arrow_back</span></a>
<h1 class="font-display-lg-mobile text-display-lg-mobile italic uppercase tracking-tighter text-primary">FUTSAFEM</h1>
</div>
</div>
</header>
<main class="flex-grow flex items-center justify-center px-margin-mobile py-stack-lg relative">
<div class="w-full max-w-2xl relative z-10">
<div class="bg-surface-container-low border border-outline-variant p-stack-lg md:p-10 rounded-xl rare-glow relative overflow-hidden">
<form class="flex flex-col gap-stack-lg relative z-10" id="registro-form">
<div class="grid grid-cols-1 md:grid-cols-2 gap-stack-md">
<div class="flex flex-col gap-2">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase">Nombre del Hincha</label>
<input class="bg-surface-container-high border border-outline-variant rounded-lg px-4 py-3 text-white font-body-md" id="nombre" placeholder="Ej. Martina Pérez" required type="text">
</div>
<div class="flex flex-col gap-2">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase">Correo Electrónico</label>
<input class="bg-surface-container-high border border-outline-variant rounded-lg px-4 py-3 text-white font-body-md" id="email" placeholder="amor@futsafem.com" required type="email">
</div>
</div>
<div class="flex flex-col gap-2">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase">Contraseña</label>
<input class="bg-surface-container-high border border-outline-variant rounded-lg px-4 py-3 text-white font-body-md" id="password" minlength="6" placeholder="Mínimo 6 caracteres" required type="password">
</div>
<div class="flex flex-col gap-4">
<div class="flex items-center justify-between">
<label class="font-label-caps text-label-caps text-primary uppercase font-bold tracking-wider">Club de tus Amores</label>
</div>
<div class="grid grid-cols-2 sm:grid-cols-3 gap-stack-sm" id="clubSelector">
<div class="club-option cursor-pointer group flex flex-col items-center justify-center p-stack-md border border-outline-variant bg-surface-container rounded-lg hover:border-primary transition-all duration-300" data-club="fenix">
<span class="material-symbols-outlined text-on-surface-variant group-hover:text-primary">shield</span>
<span class="font-label-caps text-[10px] text-center text-on-surface-variant uppercase">Fénix</span>
</div>
<div class="club-option cursor-pointer group flex flex-col items-center justify-center p-stack-md border border-outline-variant bg-surface-container rounded-lg hover:border-primary transition-all duration-300" data-club="television">
<span class="material-symbols-outlined text-on-surface-variant group-hover:text-primary">military_tech</span>
<span class="font-label-caps text-[10px] text-center text-on-surface-variant uppercase">Televisión</span>
</div>
<div class="club-option cursor-pointer group flex flex-col items-center justify-center p-stack-md border border-outline-variant bg-surface-container rounded-lg hover:border-primary transition-all duration-300" data-club="moron">
<span class="material-symbols-outlined text-on-surface-variant group-hover:text-primary">star</span>
<span class="font-label-caps text-[10px] text-center text-on-surface-variant uppercase">Morón</span>
</div>
<div class="club-option cursor-pointer group flex flex-col items-center justify-center p-stack-md border border-outline-variant bg-surface-container rounded-lg hover:border-primary transition-all duration-300" data-club="lamadrid">
<span class="material-symbols-outlined text-on-surface-variant group-hover:text-primary">workspace_premium</span>
<span class="font-label-caps text-[10px] text-center text-on-surface-variant uppercase">Lamadrid</span>
</div>
</div>
<input id="selectedClubInput" name="selected_club" required type="hidden">
</div>
<button class="w-full bg-primary-container text-on-primary-container font-headline-md py-stack-lg rounded-lg uppercase italic tracking-wider flex items-center justify-center gap-3 active:scale-[0.98] transition-all" id="btn-submit" type="submit">
                            EMPEZAR MI COLECCIÓN
</button>
<p class="text-center font-label-caps text-[11px] text-on-surface-variant opacity-60">
                            Al unirte, aceptás los términos de intercambio y seguridad de FUTSAFEM.
                        </p>
<p class="text-error text-body-sm hidden" id="form-error"></p>
</form>
</div>
</div>
</main>
<script type="module">
  import { registrarUsuaria } from "../js/auth-helpers.js";

  document.querySelectorAll('.club-option').forEach((opt) => {
    opt.addEventListener('click', () => {
      document.querySelectorAll('.club-option').forEach((o) => o.classList.remove('club-card-selected'));
      opt.classList.add('club-card-selected');
      document.getElementById('selectedClubInput').value = opt.dataset.club;
    });
  });

  document.getElementById('registro-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const errorEl = document.getElementById('form-error');
    errorEl.classList.add('hidden');

    const club = document.getElementById('selectedClubInput').value;
    if (!club) {
      errorEl.textContent = 'Elegí el club de tus amores.';
      errorEl.classList.remove('hidden');
      return;
    }

    const btn = document.getElementById('btn-submit');
    btn.disabled = true;
    btn.textContent = 'PROCESANDO...';

    try {
      await registrarUsuaria({
        email: document.getElementById('email').value,
        password: document.getElementById('password').value,
        perfil: {
          rol: 'hincha',
          nombre: document.getElementById('nombre').value,
          clubId: club,
        },
        fotoFile: null,
      });
      window.location.href = './home.html';
    } catch (err) {
      errorEl.textContent = 'No pudimos completar el registro: ' + err.message;
      errorEl.classList.remove('hidden');
      btn.disabled = false;
      btn.textContent = 'EMPEZAR MI COLECCIÓN';
    }
  });
</script>
</body></html>
