<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>FUTSAFEM - Carga de clubes (temporal)</title>
<style>
  body { background:#111316; color:#e2e2e6; font-family: sans-serif; padding: 40px; }
  button { background:#bd00ff; color:#fff; border:none; padding:14px 24px; font-size:16px; border-radius:8px; cursor:pointer; }
  button:disabled { opacity:0.5; cursor:not-allowed; }
  #log { margin-top: 20px; white-space: pre-wrap; font-family: monospace; font-size: 14px; }
</style>
</head>
<body>
<h1>Carga inicial de clubes</h1>
<p>Esta página escribe los 16 clubes en Firestore. Usarla UNA sola vez y después borrarla.</p>
<button id="btn">Cargar clubes</button>
<div id="log"></div>

<script type="module">
  import { db } from "../js/firebase-init.js";
  import { doc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const clubes = [
    { id: "union-y-fortaleza", nombre: "Unión y Fortaleza" },
    { id: "franja-de-oro", nombre: "Franja de Oro" },
    { id: "velez-sarsfield", nombre: "Vélez Sarsfield" },
    { id: "almagro", nombre: "Almagro" },
    { id: "defensores-de-olivos", nombre: "Defensores de Olivos" },
    { id: "padre-mugica", nombre: "Padre Mugica" },
    { id: "mavia", nombre: "Mavia" },
    { id: "villa-malcolm", nombre: "Villa Malcolm" },
    { id: "juventud-tapiales", nombre: "Juventud Tapiales" },
    { id: "comunicaciones", nombre: "Comunicaciones" },
    { id: "mirinaque", nombre: "Mirinaque" },
    { id: "ituzaingo", nombre: "Ituzaingó" },
    { id: "banfield", nombre: "Banfield" },
    { id: "atletico-provincial", nombre: "Atlético Provincial" },
    { id: "pampero", nombre: "Pampero" },
    { id: "nueva-chicago", nombre: "Nueva Chicago" },
  ];

  const logEl = document.getElementById('log');
  document.getElementById('btn').addEventListener('click', async (e) => {
    e.target.disabled = true;
    for (const club of clubes) {
      try {
        await setDoc(doc(db, "clubs", club.id), { nombre: club.nombre });
        logEl.textContent += `OK: ${club.nombre}\n`;
      } catch (err) {
        logEl.textContent += `ERROR en ${club.nombre}: ${err.message}\n`;
      }
    }
    logEl.textContent += '\nListo. Ahora volvé a poner la regla de "clubs" en write:false y borrá esta página.';
  });
</script>
</body>
</html>
