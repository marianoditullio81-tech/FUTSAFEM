<!DOCTYPE html>
<html class="dark" lang="es"><head>

                    "surface-container-low": "#1a1c1f", "on-primary-container": "#ffffff", "on-tertiary-container": "#ffffff",
                    "surface-container-lowest": "#0c0e11", "outline-variant": "#514255", "on-tertiary": "#00363a",
                    "primary-container": "#bd00ff", "tertiary-container": "#00838b", "on-secondary-fixed": "#161e00",
                    "primary-fixed": "#f8d8ff", "tertiary-fixed": "#7df4ff", "inverse-surface": "#e2e2e6",
                    "on-error-container": "#ffdad6", "secondary-container": "#c3f400", "on-surface-variant": "#d4c0d7",
                    "surface-container": "#1e2023", "on-primary": "#520071", "surface-variant": "#333538",
                    "secondary-fixed-dim": "#abd600", "background": "#111316", "secondary": "#ffffff",
                    "on-primary-fixed": "#320047", "on-background": "#e2e2e6", "primary": "#ecb2ff",
                    "inverse-primary": "#9900cf", "on-surface": "#e2e2e6", "primary-fixed-dim": "#ecb2ff",
                    "tertiary": "#00dbe9", "secondary-fixed": "#c3f400", "surface-tint": "#ecb2ff",
                    "surface-container-highest": "#333538", "on-tertiary-fixed-variant": "#004f54",
                    "surface-dim": "#111316", "surface-bright": "#37393d", "error-container": "#93000a",
                    "outline": "#9d8ba0", "error": "#ffb4ab", "on-secondary-fixed-variant": "#3c4d00"
            },
            "borderRadius": {"DEFAULT": "0.125rem", "lg": "0.25rem", "xl": "0.5rem", "full": "0.75rem"},
            "spacing": {"stack-md": "12px", "margin-desktop": "40px", "stack-lg": "24px", "margin-mobile": "20px", "gutter": "16px", "base": "8px", "stack-sm": "4px"},
            "fontFamily": {"body-sm": ["Hanken Grotesk"], "label-caps": ["JetBrains Mono"], "display-lg": ["Archivo Narrow"], "headline-md": ["Archivo Narrow"], "display-lg-mobile": ["Archivo Narrow"], "body-md": ["Hanken Grotesk"]},
            "fontSize": {
                    "body-sm": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],

<style>
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        .glow-primary { box-shadow: 0 0 20px rgba(189, 0, 255, 0.3); }

        input:focus { outline: none !important; border-color: #ecb2ff !important; box-shadow: 0 0 0 2px rgba(236, 178, 255, 0.2); }

<body class="bg-background text-on-background font-body-md selection:bg-primary-container selection:text-white min-h-screen flex flex-col items-center justify-center court-texture p-margin-mobile">
<header class="w-full top-0 fixed flex justify-between items-center px-margin-mobile h-16 z-50 bg-background/80 backdrop-blur-md">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary text-3xl">sports_soccer</span>
<h1 class="font-display-lg-mobile text-display-lg-mobile italic font-black text-primary tracking-tighter">FUTSAFEM</h1>
</div>
</header>
<main class="w-full max-w-md mt-16">
<div class="flex gap-2 mb-stack-lg">
<div class="h-1 flex-1 bg-primary rounded-full"></div>
<div class="h-1 flex-1 bg-primary rounded-full"></div>
<div class="h-1 flex-1 bg-surface-container-highest rounded-full"></div>
</div>
<div class="bg-surface-container border border-outline-variant p-margin-mobile rounded-xl relative overflow-hidden">
<div class="absolute -top-24 -right-24 w-48 h-48 bg-primary/10 blur-[80px] rounded-full"></div>
<div class="relative z-10">
<span class="font-label-caps text-label-caps text-secondary-fixed mb-stack-sm block">PASO 2 DE 3</span>
<h2 class="font-headline-md text-headline-md font-bold mb-base">Validación de edad</h2>
<p class="text-on-surface-variant font-body-sm mb-stack-lg">Necesitamos verificar tu edad para cumplir con las regulaciones de la Primera C.</p>
<form class="space-y-stack-lg" id="validacion-form">
<div class="hidden animate-in zoom-in-95 fade-in duration-300" id="guardianSection">
<div class="p-stack-md bg-primary-container/10 border border-primary/20 rounded-lg space-y-stack-md">
<div class="flex items-start gap-3">
<span class="material-symbols-outlined text-primary">security</span>
<div>
<h4 class="font-label-caps text-label-caps text-primary">REQUERIMIENTO DE MENORES</h4>
<p class="text-body-sm text-on-surface-variant">Como sos menor de 18 años, necesitamos el contacto de un tutor legal para obtener el consentimiento.</p>
</div>
</div>
<div class="space-y-stack-md pt-2">
<div class="space-y-base">
<label class="font-label-caps text-label-caps text-on-surface-variant">EMAIL O CELULAR DEL TUTOR</label>
<div class="relative">
<span class="absolute left-3 top-1/2 -translate-y-1/2 material-symbols-outlined text-on-surface-variant text-[20px]">alternate_email</span>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg p-3 pl-10 text-on-surface" id="tutorContacto" placeholder="ejemplo@correo.com o +54..." type="text"/>
</div>
</div>
</div>
</div>
</div>
<p class="text-error text-body-sm hidden" id="form-error"></p>
<button class="w-full bg-primary text-on-primary font-headline-md py-4 rounded-full font-bold flex items-center justify-center gap-2 active:scale-95 transition-all glow-primary" id="btn-submit" type="submit">
                        CONTINUAR
                        <span class="material-symbols-outlined">arrow_forward</span>
</button>
</form>
</div>
</div>
</main>
<script type="module">
  import { exigirSesion, obtenerPerfil, actualizarPerfil } from "../js/auth-helpers.js";

  let usuariaActual = null;

  exigirSesion(async (user) => {
    usuariaActual = user;
    const perfil = await obtenerPerfil(user.uid);
    // Si llegó acá es porque es menor; si por alguna razón no tiene fecha
    // de nacimiento en el perfil, la mandamos al registro.
    if (!perfil || !perfil.fechaNacimiento) {
      window.location.replace('./registro-jugadora.html');
      return;
    }
    // Si ya es adulta (no debería pasar), redirigir directo a home.
    if ((perfil.edad ?? 18) >= 18) {
      window.location.replace('./home.html');
      return;
    }
    document.getElementById('guardianSection').classList.remove('hidden');
  });

  document.getElementById('validacion-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const errorEl = document.getElementById('form-error');
    errorEl.classList.add('hidden');

    const tutorContacto = document.getElementById('tutorContacto').value.trim();
    if (!tutorContacto) {
      errorEl.textContent = 'Ingresá el contacto de tu tutor legal.';
      errorEl.classList.remove('hidden');
      return;
    }

    const btn = document.getElementById('btn-submit');
    btn.disabled = true;
    btn.textContent = 'PROCESANDO...';

    try {
      await actualizarPerfil(usuariaActual.uid, { estadoConsentimiento: 'pendiente', tutorContacto });
      window.location.href = './autorizacion-tutor.html';
    } catch (err) {
      errorEl.textContent = 'No pudimos guardar el contacto del tutor: ' + err.message;
      errorEl.classList.remove('hidden');
      btn.disabled = false;
      btn.textContent = 'CONTINUAR';
    }
  });
</script>
</body></html>
