<script type="module">
  import { exigirSesion } from "../js/auth-helpers.js";
  import { obtenerJugadorasDeStickers } from "../js/sobre-helpers.js";
  import { PLACEHOLDER_STICKER_URL } from "../js/home-helpers.js";

  exigirSesion(async () => {
    const datos = JSON.parse(sessionStorage.getItem('revealPlata') || 'null');
    if (!datos || !datos.sticker) {
      window.location.replace('./resultado-de-apertura.html');
      return;
    }

    const jugadoras = await obtenerJugadorasDeStickers([datos.sticker]);
    const jugadora = jugadoras.get(datos.sticker.playerId);
    const nombre = jugadora ? jugadora.nombre : 'Desconocida';
    const puesto = jugadora ? (jugadora.puesto || '').toUpperCase() : '';

    document.getElementById('card-img').src = datos.sticker.imagenUrl || PLACEHOLDER_STICKER_URL;
    document.getElementById('card-img').alt = nombre;
    document.getElementById('card-nombre').textContent = nombre;
    document.getElementById('card-puesto').textContent = puesto || 'PROFESSIONAL WOMEN\'S FUTSAL';

    function continuar() {
      sessionStorage.removeItem('revealPlata');
      window.location.href = './resultado-de-apertura.html';
    }
    document.getElementById('btn-cerrar').addEventListener('click', continuar);
    document.getElementById('btn-colectar').addEventListener('click', continuar);
  });
</script>
<!-- Silver Shader Implementation -->
<script>
(function() {
  const canvas = document.getElementById('shader-canvas-plata');
  function syncSize() {
    const w = canvas.clientWidth  || 1280;
    const h = canvas.clientHeight || 720;
    if (canvas.width !== w || canvas.height !== h) {
      canvas.width  = w;
      canvas.height = h;
    }
  }
  if (typeof ResizeObserver !== 'undefined') {
    new ResizeObserver(syncSize).observe(canvas);
  }
  syncSize();
  const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
  if (!gl) return;
  const vs = `attribute vec2 a_position;
varying vec2 v_texCoord;
void main() {
  v_texCoord = a_position * 0.5 + 0.5;
  gl_Position = vec4(a_position, 0.0, 1.0);
}`;
  const fs = `precision highp float;
uniform float u_time;
uniform vec2 u_resolution;
varying vec2 v_texCoord;
void main() {
    vec2 uv = v_texCoord;
    vec2 center = vec2(0.5, 0.5);
    float dist = distance(uv, center);
    vec3 colorSilver = vec3(0.75, 0.75, 0.8);
    vec3 colorChrome = vec3(0.95, 0.95, 1.0);
    vec3 colorDark = vec3(0.1, 0.1, 0.12);
    float metal = sin(dist * 20.0 - u_time * 4.0);
    float pattern = sin(uv.x * 15.0 + u_time) * cos(uv.y * 15.0 + u_time);
    vec3 finalColor = mix(colorDark, colorSilver, (1.0 - dist));
    float highlight = pow(max(0.0, 0.5 + 0.5 * sin(dist * 10.0 + pattern - u_time * 5.0)), 10.0);
    finalColor += colorChrome * highlight * 0.6;
    float glow = smoothstep(0.5, 0.2, dist);
    finalColor += colorSilver * glow * 0.2;
    gl_FragColor = vec4(finalColor, 1.0);
}`;
  function cs(type, src) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    return s;
  }
  const prog = gl.createProgram();
  gl.attachShader(prog, cs(gl.VERTEX_SHADER, vs));
  gl.attachShader(prog, cs(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(prog);
  gl.useProgram(prog);
  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
  const pos = gl.getAttribLocation(prog, 'a_position');
  gl.enableVertexAttribArray(pos);
  gl.vertexAttribPointer(pos, 2, gl.FLOAT, false, 0, 0);
  const uTime = gl.getUniformLocation(prog, 'u_time');
  function render(t) {
    if (typeof ResizeObserver === 'undefined') syncSize();
    gl.viewport(0, 0, canvas.width, canvas.height);
    if (uTime) gl.uniform1f(uTime, t * 0.001);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    requestAnimationFrame(render);
  }
  render(0);
})();
</script>
<!-- Tilt micro-interaction -->
<script>
document.addEventListener('mousemove', (e) => {
    const card = document.querySelector('.animate-float');
    if (!card) return;
    const xAxis = (window.innerWidth / 2 - e.pageX) / 25;
    const yAxis = (window.innerHeight / 2 - e.pageY) / 25;
    card.style.transform = `rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
});
</script>
