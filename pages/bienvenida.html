<style>
      .material-symbols-outlined {
        font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      }
      .bg-blur-gradient {
        background: radial-gradient(circle at top right, rgba(189, 0, 255, 0.15), transparent 50%),
                    radial-gradient(circle at bottom left, rgba(0, 219, 233, 0.1), transparent 50%);
      }
      .sticker-glow {
        box-shadow: 0 0 20px rgba(189, 0, 255, 0.3);
      }
      body {
        background-color: #111316;
        color: #e2e2e6;
        overflow-x: hidden;
      }
    </style>
</head>
<body class="flex flex-col min-h-screen">
<header class="w-full top-0 sticky bg-background border-b border-outline-variant flex justify-between items-center px-margin-mobile h-16 z-50">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">sports_soccer</span>
<h1 class="font-display-lg-mobile text-display-lg-mobile italic font-black text-primary tracking-tighter">FUTSAFEM</h1>
</div>
</header>
<main class="flex-grow relative bg-blur-gradient">
<section class="relative h-[60vh] flex flex-col justify-end px-margin-mobile pb-12 overflow-hidden">
<div class="absolute inset-0 z-0">
<div class="w-full h-full bg-cover bg-center" style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuAXJE74rpo45cETe41kSmjYJgn7chMtwhoz0Jrpb76cPAPejCEvj2gwCslWDNNt7c61Yd4zZrZOHED7lbTubf1uvQvz9ocsqCsuxFoN0fazBizTV6uIWkRxvzMWRODAy_Wn9Nkvb5RkD4fspWyofNLgllDeu0ss0K5vzueFB0Cmm2gQ9aYmeuvbPaoKixzuTM6itJTNVrYxtMVdFmCP-fm86ktdDHI1CFxL1fFcfikYCQCNs2r4LQOrEJZ-nVUarLEh8H5EJEp_1Wa0')"></div>
<div class="absolute inset-0 bg-gradient-to-t from-background via-background/40 to-transparent"></div>
</div>
<div class="relative z-10 flex flex-col gap-stack-md">
<h2 class="font-display-lg-mobile text-display-lg-mobile uppercase italic font-black leading-none text-secondary">
          DOMINA LA <br><span class="text-primary">PISTA VIRTUAL</span>
</h2>
<p class="font-body-md text-body-md text-on-surface-variant max-w-[80%]">
          Colecciona, compite y lidera el futuro del Futsal Femenino Argentino. La Primera C despega aquí.
        </p>
</div>
</section>
<section class="px-margin-mobile py-stack-lg flex flex-col gap-stack-md">
<h3 class="font-label-caps text-label-caps text-on-surface-variant tracking-[0.2em] mb-2 uppercase">Elegí tu Perfil</h3>
<div class="grid grid-cols-3 gap-stack-md h-32">
<button class="profile-card group flex flex-col items-center justify-center border rounded-xl transition-all duration-300 hover:border-primary active:scale-95 bg-surface-container-high border-outline-variant" id="profile-jugadora" onclick="selectProfile('JUGADORA')" type="button">
<span class="material-symbols-outlined group-hover:text-primary mb-2 transition-colors text-on-surface-variant">directions_run</span>
<span class="font-label-caps text-[10px] text-center px-1 text-on-surface-variant">JUGADORA</span>
</button>
<button class="profile-card group flex flex-col items-center justify-center border rounded-xl transition-all duration-300 active:scale-95 bg-surface-container-high border-outline-variant" id="profile-fan" onclick="selectProfile('FAN')" type="button">
<span class="material-symbols-outlined mb-2 text-on-surface-variant">star</span>
<span class="font-label-caps text-[10px] text-center px-1 text-on-surface-variant">FAN O HINCHADA</span>
</button>
<button class="profile-card group flex flex-col items-center justify-center border rounded-xl transition-all duration-300 hover:border-primary active:scale-95 bg-surface-container-high border-outline-variant" id="profile-club" onclick="selectProfile('CLUB')" type="button">
<span class="material-symbols-outlined group-hover:text-primary mb-2 transition-colors text-on-surface-variant">groups</span>
<span class="font-label-caps text-[10px] text-center px-1 text-on-surface-variant">CUERPO TÉCNICO</span>
</button>
</div>
</section>
<section class="px-margin-mobile py-stack-lg flex flex-col gap-stack-md">
<button class="w-full py-5 bg-primary-container text-on-primary-container font-headline-md text-headline-md rounded-xl flex items-center justify-center gap-3 active:scale-95 transition-transform duration-150 uppercase font-bold sticker-glow" id="btn-empezar" type="button">
        EMPEZAR AHORA
        <span class="material-symbols-outlined">arrow_forward_ios</span>
</button>
<button class="w-full py-5 bg-transparent border-2 border-outline text-secondary font-headline-md text-headline-md rounded-xl flex items-center justify-center gap-3 active:scale-95 transition-transform duration-150 uppercase font-bold" id="btn-login" type="button">
        INICIAR SESIÓN
      </button>
</section>
</main>
<script>
    let perfilSeleccionado = null;

    function selectProfile(type) {
      perfilSeleccionado = type;
      const cards = document.querySelectorAll('.profile-card');
      cards.forEach(card => {
        card.classList.remove('bg-primary-container', 'border-primary', 'sticker-glow');
        card.classList.add('bg-surface-container-high', 'border-outline-variant');
        const icon = card.querySelector('.material-symbols-outlined');
        icon.classList.remove('text-on-primary-container');
        icon.classList.add('text-on-surface-variant');
        const text = card.querySelector('span:last-child');
        text.classList.remove('text-on-primary-container');
        text.classList.add('text-on-surface-variant');
      });

      const selected = document.getElementById(`profile-${type.toLowerCase()}`);
      selected.classList.remove('bg-surface-container-high', 'border-outline-variant');
      selected.classList.add('bg-primary-container', 'border-primary', 'sticker-glow');
      const selIcon = selected.querySelector('.material-symbols-outlined');
      selIcon.classList.remove('text-on-surface-variant');
      selIcon.classList.add('text-on-primary-container');
      const selText = selected.querySelector('span:last-child');
      selText.classList.remove('text-on-surface-variant');
      selText.classList.add('text-on-primary-container');
    }

    document.getElementById('btn-empezar').addEventListener('click', () => {
      if (!perfilSeleccionado) {
        alert('Elegí tu perfil para continuar: Jugadora, Fan o Cuerpo Técnico.');
        return;
      }
      const destinos = {
        JUGADORA: './registro-jugadora.html',
        FAN: './registro-hincha.html',
        CLUB: './registro-ct.html',
      };
      window.location.href = destinos[perfilSeleccionado];
    });

    document.getElementById('btn-login').addEventListener('click', () => {
      window.location.href = './login.html';
    });
  </script>
</body></html>
