<!DOCTYPE html><html class="dark" lang="es"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport">
<title>FUTSAFEM - Admin: usuarias</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@400;600;700&amp;family=Hanken+Grotesk:wght@400;600&amp;family=JetBrains+Mono:wght@500&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "primary": "#ecb2ff", "on-primary-container": "#ffffff", "on-primary": "#520071",
                    "primary-container": "#bd00ff", "secondary": "#ffffff", "secondary-container": "#c3f400",
                    "on-secondary-container": "#556d00", "error": "#ffb4ab", "error-container": "#93000a",
                    "on-error-container": "#ffdad6", "surface": "#111316", "surface-container": "#1e2023",
                    "surface-container-high": "#282a2d", "surface-container-highest": "#333538",
                    "on-surface": "#e2e2e6", "on-surface-variant": "#d4c0d7", "outline": "#9d8ba0",
                    "outline-variant": "#514255", "background": "#111316"
            },
            "borderRadius": {"DEFAULT": "0.125rem", "lg": "0.25rem", "xl": "0.5rem", "full": "0.75rem"},
            "spacing": {"base": "8px", "margin-mobile": "20px", "stack-sm": "4px", "stack-md": "12px", "gutter": "16px", "stack-lg": "24px"},
            "fontFamily": {"display-lg-mobile": ["Archivo Narrow"], "headline-md": ["Archivo Narrow"], "label-caps": ["JetBrains Mono"], "body-sm": ["Hanken Grotesk"], "body-md": ["Hanken Grotesk"]},
            "fontSize": {
                    "display-lg-mobile": ["36px", {"lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                    "headline-md": ["24px", {"lineHeight": "28px", "letterSpacing": "0.01em", "fontWeight": "600"}],
                    "label-caps": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "500"}],
                    "body-sm": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                    "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}]
            }
          },
        },
      }
    </script>
<style>
        body { background-color: #111316; color: #e2e2e6; -webkit-font-smoothing: antialiased; }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
</style>
</head>
<body class="font-body-md min-h-screen pb-16">
<header class="bg-surface sticky top-0 z-50 flex items-center gap-4 px-margin-mobile h-16 border-b border-outline-variant">
<a href="./admin.html"><span class="material-symbols-outlined text-primary text-2xl">arrow_back</span></a>
<h1 class="font-display-lg-mobile text-display-lg-mobile text-primary tracking-tight italic uppercase">Usuarias</h1>
</header>
<main class="px-margin-mobile pt-stack-lg max-w-md mx-auto flex flex-col gap-stack-md">
<input class="bg-surface-container-high border border-outline-variant rounded-lg px-4 py-3 text-white font-body-md" id="buscador" placeholder="Buscar por nombre o email..." type="text">
<div id="lista-usuarias" class="flex flex-col gap-stack-sm"></div>
</main>
<script type="module">
  import { exigirSesion, obtenerPerfil } from "../js/auth-helpers.js";
  import { listarUsuarias, cambiarDisponibilidadCuenta } from "../js/admin-helpers.js";

  const NOMBRES_ROL = { jugadora: 'Jugadora', ct: 'Cuerpo Técnico', hincha: 'Hincha', admin: 'Administradora' };

  exigirSesion(async (user) => {
    const perfil = await obtenerPerfil(user.uid);
    if (!perfil || perfil.rol !== 'admin') {
      window.location.replace('./home.html');
      return;
    }

    const lista = document.getElementById('lista-usuarias');
    const buscador = document.getElementById('buscador');
    const usuarias = await listarUsuarias();

    function renderizar(filtro) {
      lista.innerHTML = '';
      const texto = (filtro || '').toLowerCase();
      const filtradas = usuarias.filter((u) =>
        (u.nombre || '').toLowerCase().includes(texto) || (u.email || '').toLowerCase().includes(texto)
      );

      for (const datos of filtradas) {
        const card = document.createElement('div');
        card.className = 'bg-surface-container border border-outline-variant rounded-lg p-3 flex items-center gap-3';
        card.innerHTML = `
          <div class="flex-grow">
            <p class="font-body-md text-white">${datos.nombre || datos.apodo || 'Sin nombre'} ${datos.deshabilitada ? '<span class="text-error font-label-caps text-[10px]">DESHABILITADA</span>' : ''}</p>
            <p class="font-body-sm text-on-surface-variant">${datos.email || ''} · ${NOMBRES_ROL[datos.rol] || datos.rol}</p>
          </div>
          <button class="btn-toggle font-label-caps text-label-caps px-3 py-2 rounded-lg uppercase ${datos.deshabilitada ? 'bg-secondary-container text-on-secondary-container' : 'bg-error-container text-on-error-container'}">
            ${datos.deshabilitada ? 'Habilitar' : 'Deshabilitar'}
          </button>
        `;
        lista.appendChild(card);

        card.querySelector('.btn-toggle').addEventListener('click', async (e) => {
          e.target.disabled = true;
          const nuevoEstado = !datos.deshabilitada;
          await cambiarDisponibilidadCuenta(datos.uid, nuevoEstado);
          datos.deshabilitada = nuevoEstado;
          renderizar(buscador.value);
        });
      }
    }

    renderizar('');
    buscador.addEventListener('input', () => renderizar(buscador.value));
  });
</script>
</body></html>
