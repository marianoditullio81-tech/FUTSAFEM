<style>
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; display: inline-block; line-height: 1; vertical-align: middle; }

<body class="bg-background text-on-background min-h-screen flex flex-col overflow-hidden selection:bg-secondary-container selection:text-black">
<!-- Gold Energy Shader Background -->
<div class="fixed inset-0 z-0">
<div class="absolute inset-0 w-full h-full opacity-70" style="display:block;">
<canvas id="shader-canvas-oro" style="display:block;width:100%;height:100%"></canvas>
<script>
    (function() {
      const canvas = document.getElementById('shader-canvas-oro');
      function syncSize() {
        const w = canvas.clientWidth  || 1280;
        const h = canvas.clientHeight || 720;
        if (canvas.width !== w || canvas.height !== h) {
          canvas.width  = w;
          canvas.height = h;
        }
      }
      if (typeof ResizeObserver !== 'undefined') {
        new ResizeObserver(syncSize).observe(canvas);
      }
      syncSize();
      const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
      if (!gl) return;
      const vs = `attribute vec2 a_position;
    varying vec2 v_texCoord;
    void main() {
      v_texCoord = a_position * 0.5 + 0.5;
      gl_Position = vec4(a_position, 0.0, 1.0);
    }`;
      const fs = `precision highp float;
    uniform float u_time;
    uniform vec2 u_resolution;
    varying vec2 v_texCoord;
    void main() {
        vec2 uv = v_texCoord;
        vec2 center = vec2(0.5, 0.5);
        float dist = distance(uv, center);
        vec3 colorGold = vec3(1.0, 0.85, 0.3);
        vec3 colorShine = vec3(1.0, 1.0, 0.8);
        vec3 colorBlack = vec3(0.05, 0.04, 0.0);
        float shimmer = sin(uv.x * 10.0 + uv.y * 5.0 + u_time * 2.0);
        shimmer += sin(uv.x * -8.0 + uv.y * 12.0 + u_time * 1.5);
        vec3 finalColor = mix(colorBlack, colorGold, (1.0 - dist) * 0.8);
        float angle = atan(uv.y - 0.5, uv.x - 0.5);
        float rays = pow(0.5 + 0.5 * sin(angle * 8.0 + u_time), 3.0);
        finalColor += colorGold * rays * (1.0 - dist) * 0.5;
        float streak = smoothstep(0.48, 0.5, 0.5 + 0.5 * sin(uv.x * 20.0 + uv.y * 20.0 - u_time * 10.0));
        finalColor += colorShine * streak * 0.3;
        gl_FragColor = vec4(finalColor, 1.0);
    }`;
      function cs(type, src) {
        const s = gl.createShader(type);
        gl.shaderSource(s, src);
        gl.compileShader(s);
        return s;
      }
      const prog = gl.createProgram();
      gl.attachShader(prog, cs(gl.VERTEX_SHADER, vs));
      gl.attachShader(prog, cs(gl.FRAGMENT_SHADER, fs));
      gl.linkProgram(prog);
      gl.useProgram(prog);
      const buf = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, buf);
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
      const pos = gl.getAttribLocation(prog, 'a_position');
      gl.enableVertexAttribArray(pos);
      gl.vertexAttribPointer(pos, 2, gl.FLOAT, false, 0, 0);
      const uTime = gl.getUniformLocation(prog, 'u_time');
      const uRes = gl.getUniformLocation(prog, 'u_resolution');
      function render(t) {
        if (typeof ResizeObserver === 'undefined') syncSize();
        gl.viewport(0, 0, canvas.width, canvas.height);
        if (uTime) gl.uniform1f(uTime, t * 0.001);
        if (uRes) gl.uniform2f(uRes, canvas.width, canvas.height);
        gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
        requestAnimationFrame(render);
      }
      render(0);
    })();
    </script>

<script type="module">
  import { exigirSesion } from "../js/auth-helpers.js";
  import { obtenerJugadorasDeStickers } from "../js/sobre-helpers.js";
  import { PLACEHOLDER_STICKER_URL } from "../js/home-helpers.js";

  exigirSesion(async () => {
    const datos = JSON.parse(sessionStorage.getItem('revealOro') || 'null');
    if (!datos || !datos.sticker) {
      window.location.replace('./resultado-de-apertura.html');
      return;
    }

    const jugadoras = await obtenerJugadorasDeStickers([datos.sticker]);
    const jugadora = jugadoras.get(datos.sticker.playerId);
    const nombre = jugadora ? jugadora.nombre : 'Desconocida';
    const puesto = jugadora ? (jugadora.puesto || '').toUpperCase() : '';

    document.getElementById('card-img').src = datos.sticker.imagenUrl || PLACEHOLDER_STICKER_URL;
    document.getElementById('card-img').alt = nombre;
    document.getElementById('card-nombre').textContent = nombre;
    document.getElementById('card-puesto').textContent = puesto || 'FUTSAFEM • EDICIÓN ORO';

    function continuar() {
      sessionStorage.removeItem('revealOro');
      window.location.href = './resultado-de-apertura.html';
    }
    document.getElementById('btn-cerrar').addEventListener('click', continuar);
    document.getElementById('btn-colectar').addEventListener('click', continuar);
  });
</script>
<!-- Tilt micro-interaction -->
<script>
        document.addEventListener('mousemove', (e) => {
            const card = document.querySelector('.animate-float');
            if (!card) return;
            const xAxis = (window.innerWidth / 2 - e.pageX) / 25;
            const yAxis = (window.innerHeight / 2 - e.pageY) / 25;
            card.style.transform = `rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
        });
    </script>
