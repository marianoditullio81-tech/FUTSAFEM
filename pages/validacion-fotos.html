<!DOCTYPE html><html class="dark" lang="es"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport">
<title>FUTSAFEM - Validar fotos</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@400;600;700&amp;family=Hanken+Grotesk:wght@400;600&amp;family=JetBrains+Mono:wght@500&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "primary": "#ecb2ff", "on-primary-container": "#ffffff", "on-primary": "#520071",
                    "primary-container": "#bd00ff", "secondary": "#ffffff", "secondary-container": "#c3f400",
                    "on-secondary-container": "#556d00", "error": "#ffb4ab", "error-container": "#93000a",
                    "on-error-container": "#ffdad6", "surface": "#111316", "surface-container": "#1e2023",
                    "surface-container-low": "#1a1c1f", "surface-container-high": "#282a2d",
                    "surface-container-highest": "#333538", "on-surface": "#e2e2e6", "on-surface-variant": "#d4c0d7",
                    "outline": "#9d8ba0", "outline-variant": "#514255", "background": "#111316"
            },
            "borderRadius": {"DEFAULT": "0.125rem", "lg": "0.25rem", "xl": "0.5rem", "full": "0.75rem"},
            "spacing": {"base": "8px", "margin-mobile": "20px", "stack-sm": "4px", "stack-md": "12px", "gutter": "16px", "stack-lg": "24px"},
            "fontFamily": {"display-lg-mobile": ["Archivo Narrow"], "headline-md": ["Archivo Narrow"], "label-caps": ["JetBrains Mono"], "body-sm": ["Hanken Grotesk"], "body-md": ["Hanken Grotesk"]},
            "fontSize": {
                    "display-lg-mobile": ["36px", {"lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                    "headline-md": ["24px", {"lineHeight": "28px", "letterSpacing": "0.01em", "fontWeight": "600"}],
                    "label-caps": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "500"}],
                    "body-sm": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                    "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}]
            }
          },
        },
      }
    </script>
<style>
        body { background-color: #111316; color: #e2e2e6; -webkit-font-smoothing: antialiased; }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
</style>
</head>
<body class="font-body-md min-h-screen pb-32">
<header class="bg-surface sticky top-0 z-50 flex items-center gap-4 px-margin-mobile h-16 border-b border-outline-variant">
<a href="./home.html"><span class="material-symbols-outlined text-primary text-2xl">arrow_back</span></a>
<h1 class="font-display-lg-mobile text-display-lg-mobile text-primary tracking-tight italic uppercase">Validar Fotos</h1>
</header>
<main class="px-margin-mobile pt-stack-lg max-w-md mx-auto flex flex-col gap-stack-md">
<p class="font-body-sm text-on-surface-variant">Ayudá a validar que estas fotos de perfil sean reales y respetuosas. Con 3 votos de aprobación la foto queda activa; con 3 de rechazo, se la pide de nuevo.</p>
<div id="lista-fotos" class="flex flex-col gap-stack-md"></div>
<div class="hidden text-center py-stack-lg text-on-surface-variant" id="estado-vacio">
<span class="material-symbols-outlined text-5xl mb-2">task_alt</span>
<p class="font-body-md">No hay fotos pendientes de validación por ahora.</p>
</div>
</main>
<script type="module">
  import { exigirSesion, obtenerPerfil } from "../js/auth-helpers.js";
  import { obtenerClub } from "../js/home-helpers.js";
  import { obtenerFotosPendientes, yaVoteEstaFoto, votarFoto } from "../js/validacion-helpers.js";

  exigirSesion(async (user) => {
    const perfil = await obtenerPerfil(user.uid);
    if (!perfil) return;
    if (perfil.estadoConsentimiento === 'pendiente') {
      window.location.replace('./esperando-consentimiento.html');
      return;
    }

    const lista = document.getElementById('lista-fotos');
    const vacio = document.getElementById('estado-vacio');
    const pendientes = await obtenerFotosPendientes(user.uid);

    if (pendientes.length === 0) {
      vacio.classList.remove('hidden');
      return;
    }

    for (const datos of pendientes) {
      const yaVoto = await yaVoteEstaFoto(datos.uid, user.uid);
      if (yaVoto) continue;

      const club = await obtenerClub(datos.clubId);
      const card = document.createElement('div');
      card.className = 'bg-surface-container border border-outline-variant rounded-xl p-4 flex gap-4 items-center';
      card.innerHTML = `
        <img class="w-20 h-20 rounded-lg object-cover bg-surface-container-highest" src="${datos.fotoUrl}">
        <div class="flex-grow">
          <p class="font-headline-md text-headline-md text-white">${datos.nombre || datos.apodo || 'Sin nombre'}</p>
          <p class="font-label-caps text-label-caps text-on-surface-variant uppercase">${club ? club.nombre : (datos.clubId || '')}</p>
          <div class="flex gap-2 mt-3">
            <button class="btn-aprobar flex-1 bg-secondary-container text-on-secondary-container font-label-caps text-label-caps py-2 rounded-lg uppercase flex items-center justify-center gap-1">
              <span class="material-symbols-outlined text-base">check</span> Aprobar
            </button>
            <button class="btn-rechazar flex-1 bg-error-container text-on-error-container font-label-caps text-label-caps py-2 rounded-lg uppercase flex items-center justify-center gap-1">
              <span class="material-symbols-outlined text-base">close</span> Rechazar
            </button>
          </div>
          <p class="text-error text-body-sm hidden mt-2 error-card"></p>
        </div>
      `;
      lista.appendChild(card);

      const botones = card.querySelectorAll('button');
      const errorEl = card.querySelector('.error-card');

      const votar = async (voto) => {
        botones.forEach((b) => (b.disabled = true));
        try {
          await votarFoto(datos.uid, user.uid, voto);
          card.remove();
          if (lista.children.length === 0) vacio.classList.remove('hidden');
        } catch (err) {
          errorEl.textContent = err.message || 'No pudimos registrar tu voto.';
          errorEl.classList.remove('hidden');
          botones.forEach((b) => (b.disabled = false));
        }
      };

      card.querySelector('.btn-aprobar').addEventListener('click', () => votar('aprobar'));
      card.querySelector('.btn-rechazar').addEventListener('click', () => votar('rechazar'));
    }

    if (lista.children.length === 0) vacio.classList.remove('hidden');
  });
</script>
</body></html>
