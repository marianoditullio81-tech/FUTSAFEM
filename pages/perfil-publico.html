<!DOCTYPE html><html class="dark" lang="es"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport">
<title>FUTSAFEM - Perfil</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@400;600;700&amp;family=Hanken+Grotesk:wght@400;600&amp;family=JetBrains+Mono:wght@500&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "primary": "#ecb2ff", "on-primary-container": "#ffffff", "on-primary": "#520071",
                    "primary-container": "#bd00ff", "secondary": "#ffffff", "secondary-container": "#c3f400",
                    "on-secondary-container": "#556d00", "error": "#ffb4ab", "error-container": "#93000a",
                    "on-error-container": "#ffdad6", "surface": "#111316", "surface-container": "#1e2023",
                    "surface-container-high": "#282a2d", "surface-container-highest": "#333538",
                    "on-surface": "#e2e2e6", "on-surface-variant": "#d4c0d7", "outline": "#9d8ba0",
                    "outline-variant": "#514255", "background": "#111316"
            },
            "borderRadius": {"DEFAULT": "0.125rem", "lg": "0.25rem", "xl": "0.5rem", "full": "0.75rem"},
            "spacing": {"base": "8px", "margin-mobile": "20px", "stack-sm": "4px", "stack-md": "12px", "gutter": "16px", "stack-lg": "24px"},
            "fontFamily": {"display-lg-mobile": ["Archivo Narrow"], "headline-md": ["Archivo Narrow"], "label-caps": ["JetBrains Mono"], "body-sm": ["Hanken Grotesk"], "body-md": ["Hanken Grotesk"]},
            "fontSize": {
                    "display-lg-mobile": ["36px", {"lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                    "headline-md": ["24px", {"lineHeight": "28px", "letterSpacing": "0.01em", "fontWeight": "600"}],
                    "label-caps": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "500"}],
                    "body-sm": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                    "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}]
            }
          },
        },
      }
    </script>
<style>
        body { background-color: #111316; color: #e2e2e6; -webkit-font-smoothing: antialiased; }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
</style>
</head>
<body class="font-body-md min-h-screen pb-16">
<header class="bg-surface sticky top-0 z-50 flex items-center gap-4 px-margin-mobile h-16 border-b border-outline-variant">
<a href="javascript:history.back()"><span class="material-symbols-outlined text-primary text-2xl">arrow_back</span></a>
<h1 class="font-display-lg-mobile text-display-lg-mobile text-primary tracking-tight italic uppercase">Perfil</h1>
</header>
<main class="px-margin-mobile pt-stack-lg max-w-md mx-auto flex flex-col items-center text-center gap-3" id="contenido">
<div class="w-28 h-28 rounded-full border-4 border-primary p-1 bg-surface-container overflow-hidden flex items-center justify-center">
<img class="w-full h-full object-cover rounded-full hidden" id="foto">
<span class="material-symbols-outlined text-6xl text-on-surface-variant" id="foto-placeholder">person</span>
</div>
<div>
<h2 class="font-display-lg-mobile text-display-lg-mobile text-on-surface" id="nombre">—</h2>
<a class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-widest hover:text-primary" id="club" href="#"></a>
<p class="font-body-sm text-on-surface-variant mt-1" id="rol"></p>
</div>
</main>
<p class="hidden text-center py-stack-lg text-on-surface-variant font-body-sm" id="estado-vacio">No encontramos esta usuaria.</p>
<script type="module">
  import { exigirSesion, obtenerPerfil } from "../js/auth-helpers.js";
  import { obtenerClub } from "../js/home-helpers.js";

  const NOMBRES_ROL = { jugadora: 'Jugadora', ct: 'Cuerpo Técnico', hincha: 'Hincha', admin: 'Administradora' };
  const NOMBRES_PUESTO = { arquera: 'Arquera', cierre: 'Cierre', ala: 'Ala', pivot: 'Pivot' };
  const NOMBRES_CARGO = { dt: 'Directora Técnica', at: 'Asistente Técnica', pf: 'Preparadora Física', ea: 'Entrenadora de Arqueras', analista: 'Analista de Video', medico: 'Cuerpo Médico' };

  exigirSesion(async () => {
    const params = new URLSearchParams(window.location.search);
    const uid = params.get('uid');
    const datos = uid ? await obtenerPerfil(uid) : null;

    if (!datos) {
      document.getElementById('contenido').classList.add('hidden');
      document.getElementById('estado-vacio').classList.remove('hidden');
      return;
    }

    document.title = `FUTSAFEM - ${datos.nombre || datos.apodo || 'Perfil'}`;
    document.getElementById('nombre').textContent = datos.nombre || datos.apodo || 'Sin nombre';

    if (datos.fotoUrl && datos.estadoFoto === 'aprobada') {
      const img = document.getElementById('foto');
      img.src = datos.fotoUrl;
      img.classList.remove('hidden');
      document.getElementById('foto-placeholder').classList.add('hidden');
    }

    let etiquetaPuesto = '';
    if (datos.rol === 'jugadora') etiquetaPuesto = NOMBRES_PUESTO[datos.puesto] || '';
    else if (datos.rol === 'ct') etiquetaPuesto = NOMBRES_CARGO[datos.puesto] || '';
    document.getElementById('rol').textContent = [NOMBRES_ROL[datos.rol] || datos.rol, etiquetaPuesto].filter(Boolean).join(' · ');

    const clubEl = document.getElementById('club');
    if (datos.clubId) {
      const club = await obtenerClub(datos.clubId);
      clubEl.textContent = club ? club.nombre : datos.clubId;
      clubEl.href = `./club.html?id=${encodeURIComponent(datos.clubId)}`;
    } else {
      clubEl.classList.add('hidden');
    }
  });
</script>
</body></html>
