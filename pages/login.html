<style>
        body { background-color: #111316; color: #e2e2e6; overflow-x: hidden; }
        .glow-button { box-shadow: 0 0 20px rgba(189, 0, 255, 0.4); transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }

<body class="font-body-md text-body-md flex min-h-screen items-center justify-center p-margin-mobile">
<main class="relative z-10 w-full max-w-[420px] bg-surface-container-low p-stack-lg rounded-xl border border-outline-variant shadow-2xl">
<header class="flex flex-col items-center mb-stack-lg">
<div class="w-20 h-20 mb-stack-md relative">
<div class="relative flex items-center justify-center w-full h-full bg-surface-container-highest rounded-xl border-2 border-primary">
<span class="material-symbols-outlined text-primary text-[48px]" style="font-variation-settings: 'FILL' 1;">sports_soccer</span>
</div>
</div>
<h1 class="font-display-lg-mobile text-display-lg-mobile italic font-black text-primary tracking-tighter uppercase">FUTSAFEM</h1>
<p class="font-label-caps text-label-caps text-on-surface-variant opacity-70 mt-1 uppercase tracking-widest">Colección Digital Primera C</p>
</header>
<form class="space-y-stack-md" id="login-form">
<div class="space-y-2">
<label class="font-label-caps text-label-caps text-on-surface ml-1" for="email">CORREO ELECTRÓNICO</label>
<div class="relative input-focus-effect bg-surface-container-highest rounded-lg border border-outline-variant transition-all duration-200">
<input class="block w-full px-3 py-3 bg-transparent border-none text-on-surface placeholder:text-outline focus:ring-0 font-body-md" id="email" name="email" placeholder="usuario@ejemplo.com" required type="email"/>
</div>
</div>
<div class="space-y-2">
<label class="font-label-caps text-label-caps text-on-surface" for="password">CONTRASEÑA</label>
<div class="relative input-focus-effect bg-surface-container-highest rounded-lg border border-outline-variant transition-all duration-200">
<input class="block w-full px-3 py-3 bg-transparent border-none text-on-surface placeholder:text-outline focus:ring-0 font-body-md" id="password" name="password" placeholder="••••••••" required type="password"/>
</div>
</div>
<p class="font-body-sm text-error hidden" id="login-error"></p>
<button class="glow-button w-full py-4 px-6 bg-primary-container text-on-primary-container font-headline-md text-headline-md font-bold rounded-lg uppercase tracking-wide mt-stack-md" type="submit">INGRESAR</button>
<a class="block text-center font-body-sm text-on-surface-variant hover:text-primary transition-colors mt-2" href="./recuperacion-de-cuenta-inicio.html">¿Olvidaste tu contraseña?</a>
</form>
<footer class="mt-stack-lg pt-stack-md border-t border-outline-variant/30 text-center">
<p class="font-body-md text-body-md text-on-surface-variant mb-2">¿No tienes una cuenta todavía?</p>
<a class="inline-flex items-center gap-2 font-headline-md text-headline-md text-secondary hover:text-primary transition-colors font-bold uppercase italic" href="./bienvenida.html">
<span>Registrarme</span>
<span class="material-symbols-outlined text-[18px]">trending_flat</span>
</a>
</footer>
</main>
<script type="module">
  import { iniciarSesion, obtenerPerfil, redirigirSegunConsentimiento, cerrarSesion } from "../js/auth-helpers.js";

  document.getElementById('login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    const errorEl = document.getElementById('login-error');
    errorEl.classList.add('hidden');
    try {
      const uid = await iniciarSesion(email, password);
      const perfil = await obtenerPerfil(uid);
      if (perfil && perfil.deshabilitada) {
        await cerrarSesion();
        errorEl.textContent = 'Esta cuenta fue deshabilitada. Contactá a la administración.';
        errorEl.classList.remove('hidden');
        return;
      }
      redirigirSegunConsentimiento(perfil);
    } catch (err) {
      errorEl.textContent = 'No pudimos iniciar sesión. Revisá tu correo y contraseña.';
      errorEl.classList.remove('hidden');
    }
  });
</script>
</body></html>
