<!-- Micro-interactions Script -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const cards = document.querySelectorAll('.card-reveal');
            
            // Subtle tilt effect on mouse move
            document.addEventListener('mousemove', (e) => {
                const moveX = (e.clientX - window.innerWidth / 2) / 50;
                const moveY = (e.clientY - window.innerHeight / 2) / 50;
                
                cards.forEach((card, index) => {
                    const depth = index * 2;
                    card.style.transform = `translate(${moveX * depth}px, ${moveY * depth}px) rotate(var(--tw-rotate))`;
                });
            });

            // "Collect All" click effect
            const collectBtn = document.querySelector('button.bg-secondary-container');
            collectBtn.addEventListener('click', () => {
                cards.forEach((card, index) => {
                    setTimeout(() => {
                        card.style.transition = 'all 0.5s cubic-bezier(0.6, -0.28, 0.735, 0.045)';
                        card.style.transform = 'translateY(-1000px) scale(0)';
                        card.style.opacity = '0';
                    }, index * 100);
                });
                
                setTimeout(() => {
                    alert('Items added to your collection!');
                }, 800);
            });
        });
    </script>
