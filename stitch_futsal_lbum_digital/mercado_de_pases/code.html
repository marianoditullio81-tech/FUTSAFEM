<body class="bg-background text-on-background selection:bg-primary selection:text-on-primary overflow-hidden h-screen flex flex-col font-body-md">

</div>

</div>
</header>
<!-- Main Content Area -->
<main class="flex-1 mt-16 pb-24 relative flex flex-col items-center justify-center court-texture overflow-hidden">
<!-- Background Atmosphere -->

</div>

<div class="z-10 mb-stack-lg bg-surface-container/80 backdrop-blur-md px-6 py-2 rounded-full border border-outline-variant shadow-xl">
<span class="font-label-caps text-label-caps text-on-surface-variant">Intercambios hoy: <span class="text-secondary font-bold">2/5</span></span>
</div>
<!-- Swipeable Interface -->
<div class="relative w-full max-w-[340px] px-margin-mobile z-10 card-perspective">
<!-- Trade Request Overlay -->
<div class="absolute -top-12 left-1/2 -translate-x-1/2 w-full text-center z-20">
<p class="font-body-sm text-body-sm text-on-surface-variant bg-surface-container-high/90 px-4 py-2 rounded-lg border border-outline-variant inline-block">
                    A ella le sirve tu repetida: <span class="text-secondary font-semibold">Lucía Sosa (Común)</span>
</p>
</div>
<!-- The Sticker Card -->
<div class="swipe-card w-full aspect-[2/3] bg-surface-container-high rounded-xl overflow-hidden silver-glow relative flex flex-col" id="main-card">
<!-- Rarity Label -->
<div class="absolute top-4 left-4 z-20 bg-surface-container-highest/90 border border-outline-variant px-3 py-1 rounded-sm">
<span class="font-label-caps text-label-caps text-on-surface uppercase tracking-widest">Silver</span>
</div>
<!-- Player Image Container -->
<div class="relative flex-1 overflow-hidden">
<div class="w-full h-full bg-cover bg-center transition-transform duration-700 hover:scale-105" data-alt="A cinematic, medium-shot portrait of a determined female futsal player named Marta Ruiz from Club Pacífico. She is wearing a modern athletic kit in deep navy and white colors. The lighting is high-contrast, dramatic stadium lighting that catches the edges of her silhouette against a blurred concrete urban court background. Professional sports photography style with sharp focus and subtle film grain." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuCHodjBLJ6sTCa4RE40XbMhe5KFl3GG_0fuGUS0hQF-qddPbfmmFX_FHLvMIArXjCv5V9smqZIYEzfXhT0ki_KsGJarnetGW6Rkl0ukWNdytbI3yLKKxpqr2P1fqx5ndeZwCOA5kvkFa6tJB-dywuLzitxv8-xCaLra9-xjGQKtqjiJAVv5L2oXfg5su-dF-k61NjoMUf_acgGJghC0ygz5DgouPB0-4H6uiHlRcfSUVzEofqsXq-Iu-Dx-oWvxYgkAcZ6tVbSyhyCJ')"></div>
<!-- Gradient Overlay -->
<div class="absolute inset-0 bg-gradient-to-t from-surface-container-high via-transparent to-transparent"></div>
</div>
<!-- Info Section -->
<div class="p-6 bg-surface-container-high relative z-10 border-t border-outline-variant">
<div class="flex justify-between items-end">
<div>
<p class="font-label-caps text-label-caps text-primary uppercase mb-1">Pacífico</p>
<h2 class="font-display-lg-mobile text-display-lg-mobile text-on-surface leading-none">Marta Ruiz</h2>
</div>
<div class="w-12 h-12 bg-on-surface/5 rounded-lg flex items-center justify-center border border-outline-variant">
<span class="material-symbols-outlined text-on-surface-variant" data-icon="shield">shield</span>
</div>
</div>
</div>
<!-- Swipe Indicators (Hidden by default) -->
<div class="absolute inset-0 bg-secondary-container/20 flex items-center justify-center opacity-0 pointer-events-none transition-opacity duration-200" id="indicator-goal">
<span class="font-display-lg text-[80px] text-secondary-fixed rotate-[-12deg] border-4 border-secondary-fixed px-8 py-2 rounded-xl">GOAL</span>
</div>
<div class="absolute inset-0 bg-error-container/20 flex items-center justify-center opacity-0 pointer-events-none transition-opacity duration-200" id="indicator-foul">
<span class="font-display-lg text-[80px] text-error rotate-[12deg] border-4 border-error px-8 py-2 rounded-xl">FOUL</span>
</div>
</div>
<!-- Swipe Controls -->
<div class="flex justify-between items-center mt-stack-lg px-4">

<button class="w-16 h-16 rounded-full bg-surface-container-high border-2 border-error flex items-center justify-center text-error transition-all duration-200 hover:bg-error/10 active:scale-90 shadow-lg" id="btn-pass">
<span class="material-symbols-outlined text-[32px]" data-icon="close">close</span>
</button>
<!-- Saltár link -->
<button class="font-label-caps text-label-caps text-on-surface-variant underline underline-offset-8 decoration-outline-variant hover:text-on-surface transition-colors" id="btn-skip">
                    Saltar
                </button>
<!-- Like/Swap Button -->
<button class="w-16 h-16 rounded-full bg-secondary-container flex items-center justify-center text-on-secondary-container transition-all duration-300 hover:scale-110 active:scale-95 shadow-[0_0_20px_rgba(195,244,0,0.3)] group" id="btn-swap">

<nav class="fixed bottom-0 w-full z-50 flex justify-around items-center px-4 py-2 pb-safe bg-surface-container dark:bg-surface-container border-t border-outline-variant shadow-lg rounded-t-xl">

<span class="material-symbols-outlined" data-icon="home">home</span>
<span class="font-label-caps text-label-caps">Home</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-on-surface-variant p-2 hover:text-primary dark:hover:text-primary transition-transform duration-300 active:scale-90" href="#">
<span class="material-symbols-outlined" data-icon="style">style</span>
<span class="font-label-caps text-label-caps">Album</span>
</a>
<a class="flex flex-col items-center justify-center bg-secondary-container dark:bg-secondary-container text-on-secondary-container dark:text-on-secondary-container rounded-full px-4 py-1 transition-transform duration-300 active:scale-90" href="#">
<span class="material-symbols-outlined" data-icon="swap_calls">swap_calls</span>
<span class="font-label-caps text-label-caps">Market</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-on-surface-variant p-2 hover:text-primary dark:hover:text-primary transition-transform duration-300 active:scale-90" href="#">
<span class="material-symbols-outlined" data-icon="verified_user">verified_user</span>
<span class="font-label-caps text-label-caps">Verify</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-on-surface-variant p-2 hover:text-primary dark:hover:text-primary transition-transform duration-300 active:scale-90" href="#">
<span class="material-symbols-outlined" data-icon="person">person</span>
<span class="font-label-caps text-label-caps">Profile</span>
</a>
</nav>
<script>
        const card = document.getElementById('main-card');
        const passBtn = document.getElementById('btn-pass');
        const swapBtn = document.getElementById('btn-swap');
        const skipBtn = document.getElementById('btn-skip');
        const goalInd = document.getElementById('indicator-goal');
        const foulInd = document.getElementById('indicator-foul');

        function triggerAction(type) {
            if (type === 'pass') {
                foulInd.style.opacity = '1';
                card.style.transform = 'translateX(-150%) rotate(-30deg)';
                card.style.opacity = '0';
            } else if (type === 'swap') {
                goalInd.style.opacity = '1';
                card.style.transform = 'translateX(150%) rotate(30deg)';
                card.style.opacity = '0';
            } else {
                card.style.transform = 'translateY(-150%)';
                card.style.opacity = '0';
            }

            setTimeout(() => {
                // Reset card for demo purposes
                card.style.transition = 'none';
                card.style.transform = 'translateX(0) translateY(0) scale(0.9)';
                card.style.opacity = '0';
                goalInd.style.opacity = '0';
                foulInd.style.opacity = '0';
                
                setTimeout(() => {
                    card.style.transition = 'transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.3s ease';
                    card.style.transform = 'scale(1)';
                    card.style.opacity = '1';
                }, 50);
            }, 500);
        }

        passBtn.addEventListener('click', () => triggerAction('pass'));
        swapBtn.addEventListener('click', () => triggerAction('swap'));
        skipBtn.addEventListener('click', () => triggerAction('skip'));

        // Lightweight atmospheric hover effect
        document.addEventListener('mousemove', (e) => {
            const xAxis = (window.innerWidth / 2 - e.pageX) / 45;
            const yAxis = (window.innerHeight / 2 - e.pageY) / 45;
            if (card.style.opacity !== '0') {
                card.style.transform = `rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
            }
        });
    </script>


</body></html>
