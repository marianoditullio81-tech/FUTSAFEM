<script>
        // Micro-interaction for the password visibility toggle
        const toggleBtn = document.querySelector('button[type="button"]');
        const passInput = document.getElementById('password');
        const icon = toggleBtn?.querySelector('span');

        toggleBtn?.addEventListener('click', () => {
            if (passInput.type === 'password') {
                passInput.type = 'text';
                icon.textContent = 'visibility_off';
            } else {
                passInput.type = 'password';
                icon.textContent = 'visibility';
            }
        });

        // Simple parallax effect for background
        document.addEventListener('mousemove', (e) => {
            const moveX = (e.clientX - window.innerWidth / 2) * 0.01;
            const moveY = (e.clientY - window.innerHeight / 2) * 0.01;
            document.querySelector('.court-mesh').style.transform = `translate(${moveX}px, ${moveY}px)`;
        });
    </script>
